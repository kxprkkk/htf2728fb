<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rutyna</title>
  <meta name="description" content="Nawyki, plan dnia i historia. Wszystko zapisane na Twoim urządzeniu." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F2F2F7" id="meta-theme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rutyna" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <style>
    /* ============================================================
       Tokeny
       ============================================================ */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #F2F2F7;
      --surface: #FFFFFF;
      --fill: rgba(120, 120, 128, 0.12);
      --fill-strong: rgba(120, 120, 128, 0.22);
      --label: #000000;
      --label-2: #5E5E63;
      --label-3: #A1A1A6;
      --separator: rgba(60, 60, 67, 0.17);

      --accent: #007AFF;
      --accent-text: #0062CC;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --green: #34C759;
      --green-text: #1E7B34;
      --red: #FF3B30;
      --red-text: #D70015;
      --red-soft: rgba(255, 59, 48, 0.12);

      --lvl-0: rgba(120, 120, 128, 0.14);
      --lvl-1: rgba(52, 199, 89, 0.30);
      --lvl-2: rgba(52, 199, 89, 0.62);
      --lvl-3: #34C759;

      --glass: rgba(250, 250, 252, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.75);
      --seg-thumb: #FFFFFF;
      --scrim: rgba(0, 0, 0, 0.28);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.10), 0 1px 3px rgba(0, 0, 0, 0.06);
      --toast-bg: rgba(28, 28, 30, 0.94);

      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

      --radius-card: 1.15rem;
      --tabbar-h: 3.75rem;
      --content-w: 34rem;
    }

    html[data-theme="dark"] {
      --bg: #000000;
      --surface: #1C1C1E;
      --fill: rgba(120, 120, 128, 0.24);
      --fill-strong: rgba(120, 120, 128, 0.38);
      --label: #FFFFFF;
      --label-2: #AEAEB2;
      --label-3: #636366;
      --separator: rgba(84, 84, 88, 0.6);
      --accent: #0A84FF;
      --accent-text: #4DA3FF;
      --accent-soft: rgba(10, 132, 255, 0.22);
      --green: #30D158;
      --green-text: #30D158;
      --red: #FF453A;
      --red-text: #FF6961;
      --red-soft: rgba(255, 69, 58, 0.2);
      --lvl-0: rgba(120, 120, 128, 0.26);
      --lvl-1: rgba(48, 209, 88, 0.32);
      --lvl-2: rgba(48, 209, 88, 0.64);
      --lvl-3: #30D158;
      --glass: rgba(38, 38, 40, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.10);
      --seg-thumb: #636366;
      --scrim: rgba(0, 0, 0, 0.5);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.5);
      --toast-bg: rgba(58, 58, 60, 0.96);
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #000000;
        --surface: #1C1C1E;
        --fill: rgba(120, 120, 128, 0.24);
        --fill-strong: rgba(120, 120, 128, 0.38);
        --label: #FFFFFF;
        --label-2: #AEAEB2;
        --label-3: #636366;
        --separator: rgba(84, 84, 88, 0.6);
        --accent: #0A84FF;
        --accent-text: #4DA3FF;
        --accent-soft: rgba(10, 132, 255, 0.22);
        --green: #30D158;
        --green-text: #30D158;
        --red: #FF453A;
        --red-text: #FF6961;
        --red-soft: rgba(255, 69, 58, 0.2);
        --lvl-0: rgba(120, 120, 128, 0.26);
        --lvl-1: rgba(48, 209, 88, 0.32);
        --lvl-2: rgba(48, 209, 88, 0.64);
        --lvl-3: #30D158;
        --glass: rgba(38, 38, 40, 0.74);
        --glass-edge: rgba(255, 255, 255, 0.10);
        --seg-thumb: #636366;
        --scrim: rgba(0, 0, 0, 0.5);
        --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.5);
        --toast-bg: rgba(58, 58, 60, 0.96);
      }
    }

    /* Kolory okresów (kolory systemowe iOS) */
    .pc-amber  { --pc: #FF9500; --pc-soft: rgba(255, 149, 0, 0.18);  --pc-text: #A35200; }
    .pc-sky    { --pc: #32ADE6; --pc-soft: rgba(50, 173, 230, 0.18); --pc-text: #006E9C; }
    .pc-purple { --pc: #AF52DE; --pc-soft: rgba(175, 82, 222, 0.16); --pc-text: #8A35BC; }
    .pc-rose   { --pc: #FF2D55; --pc-soft: rgba(255, 45, 85, 0.14);  --pc-text: #CC1440; }
    .pc-teal   { --pc: #00C7BE; --pc-soft: rgba(0, 199, 190, 0.18);  --pc-text: #00736D; }
    html[data-theme="dark"] .pc-amber  { --pc-text: #FFB340; }
    html[data-theme="dark"] .pc-sky    { --pc-text: #70D7FF; }
    html[data-theme="dark"] .pc-purple { --pc-text: #DA8FFF; }
    html[data-theme="dark"] .pc-rose   { --pc-text: #FF6482; }
    html[data-theme="dark"] .pc-teal   { --pc-text: #66D4CF; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) .pc-amber  { --pc-text: #FFB340; }
      html:not([data-theme="light"]) .pc-sky    { --pc-text: #70D7FF; }
      html:not([data-theme="light"]) .pc-purple { --pc-text: #DA8FFF; }
      html:not([data-theme="light"]) .pc-rose   { --pc-text: #FF6482; }
      html:not([data-theme="light"]) .pc-teal   { --pc-text: #66D4CF; }
    }

    /* ============================================================
       Podstawy. Rozmiar tekstu idzie za ustawieniem iOS.
       ============================================================ */
    html {
      font-size: 106.25%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
    }
    @supports (font: -apple-system-body) {
      html { font: -apple-system-body; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
    }
    html.locked, html.locked body { overflow: hidden; }
    h1, h2, h3, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    svg { display: block; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      text-align: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button:disabled { cursor: default; opacity: 0.35; }
    input, select, textarea { font: inherit; font-size: max(1rem, 16px); color: var(--label); }
    :focus { outline: none; }
    :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

    /* ============================================================
       Pasek górny i duży tytuł
       ============================================================ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: var(--safe-top);
    }
    .topbar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 0.5px 0 var(--separator);
      opacity: 0;
      transition: opacity 200ms ease;
    }
    html.scrolled .topbar::before { opacity: 1; }
    .topbar-inner {
      position: relative;
      max-width: var(--content-w);
      height: 3.25rem;
      margin: 0 auto;
      padding: 0 0.75rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
    }
    .topbar-side { display: flex; align-items: center; gap: 0.5rem; }
    .topbar-side.end { justify-content: flex-end; }
    .topbar-title {
      max-width: 50vw;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(0.25rem);
      transition: opacity 200ms ease, transform 240ms var(--ease-out);
    }
    html.scrolled .topbar-title { opacity: 1; transform: none; }

    .nav-btn {
      min-width: 2.6rem;
      height: 2.6rem;
      padding: 0 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08), inset 0 0 0 0.5px var(--glass-edge);
      color: var(--accent-text);
      font-weight: 600;
      font-size: 0.94rem;
      transition: transform 160ms var(--ease-out);
    }
    .nav-btn.icon { width: 2.6rem; padding: 0; }
    .nav-btn .ic { width: 1.3rem; height: 1.3rem; stroke-width: 2.3; }
    .nav-btn:active { transform: scale(0.92); }

    .large-title {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 1.25rem 1rem;
    }
    .large-title h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.022em;
      line-height: 1.12;
    }
    .large-title p { margin-top: 0.15rem; color: var(--label-2); font-size: 0.94rem; }

    main {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 0 1rem calc(var(--tabbar-h) + var(--safe-bottom) + 2.5rem);
    }

    /* ============================================================
       Sekcje, karty, listy
       ============================================================ */
    .section { margin-bottom: 1.75rem; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0 0.25rem 0.5rem;
    }
    .section-title { font-size: 1.18rem; font-weight: 700; letter-spacing: -0.01em; }
    .section-action {
      padding: 0.5rem 0.4rem;
      margin: -0.5rem -0.4rem;
      color: var(--accent-text);
      font-size: 0.94rem;
    }
    .group-label { padding: 0 1rem 0.4rem; font-size: 0.8rem; color: var(--label-2); }
    .group-note { padding: 0.5rem 1rem 0; font-size: 0.8rem; line-height: 1.38; color: var(--label-2); }
    .group { margin-bottom: 1.75rem; }

    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .card + .card { margin-top: 1rem; }
    .section > .card + .card, .sheet-body .card { margin-top: 0; }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1rem 0.5rem;
    }
    .card-title { font-size: 1rem; font-weight: 600; }
    .card-sub { margin-top: 0.1rem; font-size: 0.8rem; color: var(--label-2); }
    .card-empty { padding: 0.25rem 1rem 1rem; color: var(--label-2); font-size: 0.94rem; }
    .badge {
      flex-shrink: 0;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .list > li { position: relative; }
    .list > li + li::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: var(--sep, 1rem);
      border-top: 0.5px solid var(--separator);
      pointer-events: none;
    }
    .list.with-check { --sep: 3.65rem; }

    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 2.85rem;
      padding: 0.55rem 1rem;
      transition: background-color 300ms ease;
    }
    .row:has(> .row-main:active) { background: var(--fill); transition: none; }
    .row-main {
      flex: 1;
      min-width: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: -0.55rem -1rem -0.55rem 0;
      padding: 0.55rem 1rem 0.55rem 0;
    }
    .row > .row-main:first-child { margin-left: -1rem; padding-left: 1rem; }
    .row-text { flex: 1; min-width: 0; display: block; }
    .row-title { display: block; line-height: 1.25; overflow-wrap: anywhere; }
    .row-title.accent { color: var(--accent-text); }
    .row-title.danger { color: var(--red-text); }
    .row-title.muted, .row.is-done .row-title { color: var(--label-2); }
    .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 0.6rem;
      margin-top: 0.18rem;
      font-size: 0.8rem;
      line-height: 1.3;
      color: var(--label-2);
    }
    .meta-item { display: inline-flex; align-items: center; gap: 0.25rem; }
    .meta-item .ic { width: 0.85rem; height: 0.85rem; }
    .meta-alert { color: var(--red-text); font-weight: 600; }
    .row-value { flex-shrink: 0; color: var(--label-2); font-size: 0.94rem; }
    .chev { width: 0.95rem; height: 0.95rem; color: var(--label-3); stroke-width: 2.4; }
    @media (hover: hover) and (pointer: fine) {
      .row:has(> .row-main:hover) { background: var(--fill); }
    }

    /* Odhaczanie */
    .check {
      flex-shrink: 0;
      width: 2.75rem;
      height: 2.75rem;
      margin: -0.5rem -0.25rem -0.5rem -0.6rem;
      display: grid;
      place-items: center;
    }
    .check-ring {
      width: 1.55rem;
      height: 1.55rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--label-3);
      transition: background-color 180ms ease, border-color 180ms ease, transform 160ms var(--ease-out);
    }
    .check.square .check-ring { border-radius: 0.45rem; }
    .check .ic {
      width: 0.95rem;
      height: 0.95rem;
      color: #FFFFFF;
      stroke-width: 3;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 150ms ease, transform 220ms var(--ease-out);
    }
    .check.is-important .check-ring { border-color: var(--accent); }
    .check.is-missed .check-ring { border-color: var(--red); }
    .check[aria-checked="true"] .check-ring { background: var(--green); border-color: var(--green); }
    .check[aria-checked="true"] .ic { opacity: 1; transform: none; }
    .check:active .check-ring { transform: scale(0.84); transition-duration: 80ms; }

    /* Postęp dnia */
    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      margin-bottom: 1.75rem;
    }
    .progress-count {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .progress-count .of { color: var(--label-2); font-weight: 600; }
    .progress-note { margin-top: 0.1rem; font-size: 0.88rem; color: var(--label-2); }
    .progress-plain { font-weight: 600; }
    .ring { position: relative; width: 3.4rem; height: 3.4rem; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { stroke: var(--fill-strong); }
    .ring-value { stroke: var(--accent); transition: stroke-dashoffset 600ms var(--ease-out), stroke 300ms ease; }
    .ring.full .ring-value { stroke: var(--green); }
    .ring.zero .ring-value { opacity: 0; }
    .ring-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 0.74rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Okresy jako pasek informacyjny */
    .strips { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .strip {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.8rem 0.65rem 0.9rem;
      border-radius: 0.95rem;
      background: var(--pc-soft);
      color: var(--pc-text);
      font-size: 0.88rem;
      transition: transform 160ms var(--ease-out);
    }
    .strip:active { transform: scale(0.98); }
    .strip .chev { color: currentColor; opacity: 0.6; }
    .strip-text { flex: 1; min-width: 0; }
    .strip-note { display: block; margin-top: 0.1rem; opacity: 0.85; }
    .dot-pc { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--pc); flex-shrink: 0; }

    /* Pusty stan */
    .empty { padding: 2.25rem 1.5rem; text-align: center; }
    .empty h2 { font-size: 1.18rem; font-weight: 700; }
    .empty p { max-width: 19rem; margin: 0.4rem auto 1.25rem; color: var(--label-2); font-size: 0.94rem; line-height: 1.4; }

    /* ============================================================
       Przyciski i kontrolki
       ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 160ms var(--ease-out);
    }
    .btn:active { transform: scale(0.96); }
    .btn-sm { min-height: 2.25rem; padding: 0 0.95rem; font-size: 0.88rem; }
    .btn-block { width: 100%; }
    .btn-filled { background: var(--accent); color: #FFFFFF; }
    .btn-tinted { background: var(--accent-soft); color: var(--accent-text); }
    .btn-gray { background: var(--fill); color: var(--label); }
    .btn-danger { background: var(--red); color: #FFFFFF; }

    .icon-btn {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-text);
    }
    .icon-btn:active { background: var(--fill); }
    .icon-btn.sm { width: 2.2rem; height: 2.2rem; color: var(--label-2); }
    .icon-btn.sm .ic { width: 1rem; height: 1rem; }
    .icon-btn.del span {
      width: 1.45rem;
      height: 1.45rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--red);
      color: #FFFFFF;
    }
    .icon-btn.del .ic { width: 0.9rem; height: 0.9rem; stroke-width: 3; }

    .switch {
      position: relative;
      flex-shrink: 0;
      width: 3.1rem;
      height: 1.9rem;
      border-radius: 999px;
      background: var(--fill-strong);
      transition: background-color 220ms ease;
    }
    .switch::before { content: ""; position: absolute; inset: -0.5rem; }
    .switch::after {
      content: "";
      position: absolute;
      top: 0.12rem;
      left: 0.12rem;
      width: 1.66rem;
      height: 1.66rem;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
      transition: transform 280ms var(--ease-drawer);
    }
    .switch[aria-checked="true"] { background: var(--green); }
    .switch[aria-checked="true"]::after { transform: translateX(1.2rem); }

    .seg {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(var(--n), 1fr);
      padding: 0.125rem;
      border-radius: 0.6rem;
      background: var(--fill);
    }
    .seg-thumb {
      position: absolute;
      z-index: -1;
      top: 0.125rem;
      bottom: 0.125rem;
      left: 0.125rem;
      width: calc((100% - 0.25rem) / var(--n));
      border-radius: 0.5rem;
      background: var(--seg-thumb);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
      transform: translateX(calc(100% * var(--i)));
      transition: transform 300ms var(--ease-drawer);
    }
    .seg button {
      min-height: 2rem;
      padding: 0.3rem 0.4rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }
    .seg button[aria-pressed="true"] { font-weight: 600; }
    .seg:has(button:disabled) { opacity: 0.45; }
    .seg button:disabled { opacity: 1; }
    .seg-wrap { margin-bottom: 1rem; }

    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.35rem; }
    .times { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.35rem; }
    .day-chip {
      height: 2.6rem;
      border-radius: 0.7rem;
      background: var(--fill);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out);
    }
    .day-chip:active { transform: scale(0.94); }
    .day-chip[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }

    /* Pola formularzy w kartach */
    .field { padding: 0 1rem; }
    .field + .field { border-top: 0.5px solid var(--separator); }
    .field-stack { display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem 1rem; }
    .field-label { font-size: 0.8rem; color: var(--label-2); }
    .input {
      width: 100%;
      min-height: 2.85rem;
      padding: 0.6rem 0;
      border: 0;
      background: transparent;
    }
    .input::placeholder { color: var(--label-3); }
    .input-time, .select {
      flex-shrink: 0;
      min-height: 2.25rem;
      padding: 0.35rem 0.7rem;
      border: 0;
      border-radius: 0.55rem;
      background: var(--fill);
      color: var(--label);
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }
    .input-time { min-width: 5.6rem; text-align: center; }
    .input-time::-webkit-date-and-time-value { text-align: center; }
    .select { max-width: 13rem; padding-right: 0.8rem; text-overflow: ellipsis; }
    .input-time:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .alert {
      margin-bottom: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--red-soft);
      color: var(--red-text);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .notice {
      margin-bottom: 1rem;
      padding: 0.65rem 0.9rem;
      border-radius: 0.8rem;
      background: var(--fill);
      color: var(--label-2);
      font-size: 0.88rem;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.25rem; }
    .chip {
      min-height: 2.25rem;
      padding: 0 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.88rem;
      font-weight: 500;
      transition: transform 160ms var(--ease-out);
    }
    .chip:active { transform: scale(0.95); }
    .chips-label { margin: 0 0.25rem 0.5rem; font-size: 0.8rem; color: var(--label-2); }

    .swatches { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .swatch {
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .swatch span {
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      background: var(--pc);
      transition: transform 180ms var(--ease-out);
    }
    .swatch[aria-checked="true"] { box-shadow: inset 0 0 0 2.5px var(--pc); }
    .swatch[aria-checked="true"] span { transform: scale(0.74); }

    /* ============================================================
       Kalendarz
       ============================================================ */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.5rem 0.35rem 1rem;
    }
    .cal-month { font-size: 1.06rem; font-weight: 600; }
    .cal-nav { display: flex; gap: 0.15rem; }
    .cal-nav button {
      width: 2.6rem;
      height: 2.6rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent-text);
    }
    .cal-nav button:active { background: var(--fill); }
    .cal-nav .ic { stroke-width: 2.4; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 0.25rem;
      padding: 0 0.5rem 0.6rem;
    }
    .cal-dow {
      padding: 0.2rem 0 0.35rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--label-2);
      text-transform: uppercase;
    }
    .cal-cell { position: relative; display: flex; justify-content: center; }
    .cal-cell.band { background: var(--pc-soft); }
    .cal-cell.band-start { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .cal-cell.band-end { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .cal-day {
      position: relative;
      width: min(2.6rem, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-variant-numeric: tabular-nums;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .cal-day:active { transform: scale(0.92); }
    .cal-day.outside { color: var(--label-3); }
    .cal-day.is-today { color: var(--accent-text); font-weight: 700; }
    .cal-day.pick[aria-pressed="true"] { background: var(--label); color: var(--bg); font-weight: 600; }
    .cal-day.pick.is-today[aria-pressed="true"] { background: var(--accent); color: #FFFFFF; }
    .cal-day.sel { outline: 2px solid var(--label); outline-offset: 1px; }
    .cal-dots {
      position: absolute;
      bottom: 0.22rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 0.18rem;
    }
    .dot { display: inline-block; width: 0.3rem; height: 0.3rem; border-radius: 50%; background: var(--accent); }
    .dot.green { background: var(--green); }
    .cal-day.pick[aria-pressed="true"] .dot { background: currentColor; }

    .cal-day.lv-1 { background: var(--lvl-1); }
    .cal-day.lv-2 { background: var(--lvl-2); }
    .cal-day.lv-3 { background: var(--lvl-3); color: #FFFFFF; font-weight: 600; }

    .cal-day.st-done { background: var(--green); color: #FFFFFF; font-weight: 600; }
    .cal-day.st-missed { background: var(--red-soft); color: var(--red-text); }
    .cal-day.st-pending { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-text); font-weight: 700; }
    .cal-day.st-off, .cal-day.st-future, .cal-day.st-before, .cal-day.st-paused { color: var(--label-3); }

    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
      padding: 0 1rem 0.9rem;
      font-size: 0.75rem;
      color: var(--label-2);
    }
    .cal-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .legend-sw { width: 0.75rem; height: 0.75rem; border-radius: 50%; display: inline-block; }

    .cal-periods { border-top: 0.5px solid var(--separator); padding: 0.4rem 0 0.4rem; }
    .mini-title { padding: 0.4rem 1rem 0.2rem; font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .mini-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-height: 2.6rem;
      padding: 0.3rem 1rem;
    }
    .mini-row:active { background: var(--fill); }
    .mini-name { flex: 1; min-width: 0; font-size: 0.94rem; }
    .mini-range { font-size: 0.8rem; color: var(--label-2); }

    /* Rok */
    .year { padding-bottom: 0.9rem; }
    .year-scroll {
      --cell: 0.78rem;
      overflow-x: auto;
      padding: 0.2rem 1rem 0.3rem;
      scrollbar-width: none;
    }
    .year-scroll::-webkit-scrollbar { display: none; }
    .year-months, .year-grid { gap: 0.2rem; }
    .year-months {
      display: grid;
      grid-template-columns: repeat(52, var(--cell));
      height: 1rem;
      margin-bottom: 0.25rem;
      font-size: 0.66rem;
      color: var(--label-2);
    }
    .year-months span { white-space: nowrap; overflow: visible; }
    .year-grid {
      display: grid;
      grid-template-rows: repeat(7, var(--cell));
      grid-auto-flow: column;
      grid-auto-columns: var(--cell);
    }
    .yc {
      display: inline-block;
      width: var(--cell, 0.78rem);
      height: var(--cell, 0.78rem);
      border-radius: 0.2rem;
      background: var(--lvl-0);
    }
    .yc.l1 { background: var(--lvl-1); }
    .yc.l2 { background: var(--lvl-2); }
    .yc.l3 { background: var(--lvl-3); }
    .yc.future { background: transparent; box-shadow: inset 0 0 0 1px var(--separator); }
    .yc.today { outline: 2px solid var(--accent); outline-offset: 1px; }
    .yc.sel { outline: 2px solid var(--label); outline-offset: 1px; }
    .year-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem 0;
      font-size: 0.75rem;
      color: var(--label-2);
    }
    .year-foot .yc { width: 0.7rem; height: 0.7rem; margin: 0 0.06rem; }

    /* Statystyki nawyku */
    .detail-meta { margin: -0.25rem 0.25rem 1rem; color: var(--label-2); font-size: 0.88rem; line-height: 1.4; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
    .stat { padding: 0.8rem 0.9rem; border-radius: 1rem; background: var(--surface); }
    .stat-label { font-size: 0.75rem; font-weight: 500; color: var(--label-2); }
    .stat-value {
      margin-top: 0.1rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .stat-sub { font-size: 0.72rem; color: var(--label-2); }
    .day-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-top: 0.5px solid var(--separator);
    }
    .dp-date { font-weight: 600; }
    .dp-status { margin-top: 0.1rem; font-size: 0.85rem; color: var(--label-2); }

    /* Planer */
    .plan-group + .plan-group { border-top: 0.5px solid var(--separator); }
    .plan-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.5rem 0 1rem;
    }
    .plan-head h3 { font-size: 0.8rem; font-weight: 600; color: var(--label-2); }
    .plan-group .list > li:first-child::before { display: none; }
    .plan-empty { padding: 0.9rem 1rem 0.2rem; color: var(--label-2); font-size: 0.94rem; }
    .time-tag {
      flex-shrink: 0;
      min-width: 2.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
    }
    .reorder { display: flex; flex-shrink: 0; margin-right: -0.5rem; }

    /* Ustawienia */
    .row .seg { flex: 0 0 auto; }
    .row .seg button { min-width: 3.1rem; }
    .settings-seg { padding: 0.65rem 1rem; }
    .app-foot { padding: 0.25rem 0 1rem; text-align: center; font-size: 0.75rem; color: var(--label-2); }

    /* ============================================================
       Dolny pasek kart (pływająca kapsuła)
       ============================================================ */
    .tabbar {
      position: fixed;
      z-index: 60;
      left: 0;
      right: 0;
      bottom: max(0.75rem, calc(var(--safe-bottom) - 0.4rem));
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      pointer-events: none;
    }
    .tabbar-inner {
      pointer-events: auto;
      width: 100%;
      max-width: 26rem;
      height: var(--tabbar-h);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.15rem;
      padding: 0.3rem;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float), inset 0 0 0 0.5px var(--glass-edge);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12rem;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 600;
      transition: transform 160ms var(--ease-out), background-color 200ms ease, color 200ms ease;
    }
    .tab .ic { width: 1.45rem; height: 1.45rem; }
    .tab[aria-current="page"] { color: var(--accent-text); background: var(--fill); }
    .tab:active { transform: scale(0.93); }

    /* ============================================================
       Arkusze (sheets)
       ============================================================ */
    .sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      animation: fade-in 320ms ease backwards;
    }
    .sheet {
      position: relative;
      width: 100%;
      max-width: var(--content-w);
      max-height: calc(100dvh - var(--safe-top) - 0.75rem);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 1.6rem 1.6rem 0 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.18);
      animation: sheet-in 480ms var(--ease-drawer) backwards;
    }
    .closing .scrim { animation: fade-out 260ms ease forwards; }
    .closing .sheet { animation: sheet-out 280ms var(--ease-drawer) forwards; }
    .sheet-head {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 1.15rem 1rem 0.65rem;
      touch-action: none;
    }
    .grabber {
      position: absolute;
      top: 0.4rem;
      left: 50%;
      width: 2.3rem;
      height: 0.3rem;
      margin-left: -1.15rem;
      border-radius: 999px;
      background: var(--fill-strong);
    }
    .sheet-title {
      max-width: 13rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-btn {
      justify-self: start;
      min-height: 2.5rem;
      padding: 0 0.95rem;
      border-radius: 999px;
      background: var(--fill);
      font-size: 0.94rem;
      font-weight: 500;
      transition: transform 160ms var(--ease-out);
    }
    .sheet-btn:active { transform: scale(0.95); }
    .sheet-btn.primary { justify-self: end; background: var(--accent); color: #FFFFFF; font-weight: 600; }
    .sheet-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem 1rem calc(1.5rem + var(--safe-bottom));
    }
    .sheet-body .card, .sheet-body .stats { margin-bottom: 1.25rem; }
    .sheet-sub { margin: -0.25rem 0.25rem 1rem; font-size: 0.88rem; color: var(--label-2); }

    .alert-sheet .sheet-body { padding-top: 1.75rem; text-align: center; }
    .alert-sheet h2 { font-size: 1.18rem; font-weight: 700; }
    .alert-sheet p { max-width: 22rem; margin: 0.5rem auto 1.5rem; color: var(--label-2); line-height: 1.4; }
    .alert-actions { display: flex; flex-direction: column; gap: 0.6rem; }

    @media (min-width: 44rem) {
      .sheet-layer { align-items: center; padding: 1.5rem; }
      .sheet {
        max-height: min(85dvh, 48rem);
        border-radius: 1.6rem;
        animation-name: dialog-in;
        animation-duration: 260ms;
        animation-timing-function: var(--ease-out);
      }
      .closing .sheet { animation: dialog-out 180ms ease forwards; }
      .grabber { display: none; }
      .sheet-body { padding-bottom: 1.5rem; }
    }

    @keyframes fade-in { from { opacity: 0; } }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes sheet-in { from { transform: translateY(100%); } }
    @keyframes sheet-out { from { transform: translateY(0); } to { transform: translateY(100%); } }
    @keyframes dialog-in { from { opacity: 0; transform: scale(0.96); } }
    @keyframes dialog-out { to { opacity: 0; transform: scale(0.97); } }

    /* Menu */
    .menu-layer { position: fixed; inset: 0; z-index: 90; }
    .menu-dismiss { position: absolute; inset: 0; }
    .menu {
      position: absolute;
      top: calc(var(--safe-top) + 3.35rem);
      right: max(1rem, calc((100vw - var(--content-w)) / 2 + 0.75rem));
      min-width: 13rem;
      overflow: hidden;
      border-radius: 1rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18), inset 0 0 0 0.5px var(--glass-edge);
      transform-origin: top right;
      animation: menu-in 220ms var(--ease-out) backwards;
    }
    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1rem;
    }
    .menu button + button { border-top: 0.5px solid var(--separator); }
    .menu button:active { background: var(--fill); }
    @keyframes menu-in { from { opacity: 0; transform: scale(0.9); } }

    /* Toast */
    .toast {
      position: fixed;
      z-index: 150;
      left: 50%;
      bottom: calc(var(--tabbar-h) + max(0.75rem, calc(var(--safe-bottom) - 0.4rem)) + 0.9rem);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.9rem;
      max-width: calc(100% - 2rem);
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      background: var(--toast-bg);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-float);
      animation: toast-in 320ms var(--ease-out) backwards;
    }
    .toast.has-action { padding-right: 0.45rem; }
    .toast.closing { animation: toast-out 200ms ease forwards; }
    .toast-action {
      flex-shrink: 0;
      min-height: 2.1rem;
      padding: 0 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #70B7FF;
      font-weight: 600;
    }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 0.75rem); } }
    @keyframes toast-out { to { opacity: 0; transform: translate(-50%, 0.4rem); } }

    /* ============================================================
       Preferencje systemowe
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .sheet, .menu { animation: fade-in 200ms ease backwards; }
      .closing .sheet { animation: fade-out 160ms ease forwards; }
      .toast { animation: fade-in 200ms ease backwards; }
      .toast.closing { animation: fade-out 160ms ease forwards; }
      .seg-thumb, .switch::after, .ring-value, .topbar-title { transition: none; }
      .check .ic { transform: none; }
      .check:active .check-ring, .btn:active, .nav-btn:active, .tab:active, .chip:active,
      .day-chip:active, .strip:active, .sheet-btn:active, .cal-day:active { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .topbar::before, .tabbar-inner, .nav-btn, .menu {
        background: var(--surface);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }
    @media (prefers-contrast: more) {
      :root { --separator: rgba(60, 60, 67, 0.45); --label-2: #3A3A3C; }
      .card, .stat { box-shadow: inset 0 0 0 1px var(--separator); }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <input type="file" id="backup-input" accept="application/json,.json" hidden />
  <noscript>Rutyna potrzebuje włączonej obsługi JavaScriptu.</noscript>

  <script>
  (function () {
    'use strict';

    const APP_VERSION = '1.0.1';

    /* ============================================================
       Daty (lokalne, odporne na zmianę czasu)
       ============================================================ */
    const pad = (n) => String(n).padStart(2, '0');
    const toDateStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    function parseDate(s) {
      const [y, m, d] = String(s).split('-').map(Number);
      return new Date(y || 1970, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }
    function addDays(s, n) {
      const d = parseDate(s);
      d.setDate(d.getDate() + n);
      return toDateStr(d);
    }
    const dow = (s) => parseDate(s).getDay();
    function weekStart(s, ws) {
      const d = parseDate(s);
      d.setDate(d.getDate() - ((d.getDay() - ws + 7) % 7));
      return toDateStr(d);
    }
    function monthDays(y, m) {
      const out = [];
      const d = new Date(y, m, 1, 12);
      while (d.getMonth() === m) {
        out.push(toDateStr(d));
        d.setDate(d.getDate() + 1);
      }
      return out;
    }
    function calendarCells(y, m, ws) {
      const first = new Date(y, m, 1, 12);
      const offset = (first.getDay() - ws + 7) % 7;
      const count = new Date(y, m + 1, 0, 12).getDate();
      const total = Math.ceil((offset + count) / 7) * 7;
      const cells = [];
      for (let i = 0; i < total; i++) {
        const d = new Date(y, m, 1 - offset + i, 12);
        cells.push({ date: toDateStr(d), inMonth: d.getMonth() === m });
      }
      return cells;
    }
    function shiftMonth(y, m, dir) {
      const d = new Date(y, m + dir, 1, 12);
      return { y: d.getFullYear(), m: d.getMonth() };
    }

    const fmtLong = new Intl.DateTimeFormat('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
    const fmtDayMonth = new Intl.DateTimeFormat('pl-PL', { day: 'numeric', month: 'long' });
    const fmtMonthYear = new Intl.DateTimeFormat('pl-PL', { month: 'long', year: 'numeric' });
    const fmtMonth = new Intl.DateTimeFormat('pl-PL', { month: 'long' });
    const fmtMonthShort = new Intl.DateTimeFormat('pl-PL', { month: 'short' });
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const longDate = (s) => cap(fmtLong.format(parseDate(s)));
    const dayMonth = (s) => fmtDayMonth.format(parseDate(s));
    const monthYear = (y, m) => cap(fmtMonthYear.format(new Date(y, m, 1, 12)));
    function dateRange(a, b) {
      if (a === b) return dayMonth(a);
      const A = parseDate(a);
      const B = parseDate(b);

    const WEEKDAYS = [

    let dbPromise = null;
    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('Ta przeglądarka nie zapisuje danych lokalnie.'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          STORES.forEach((s) => {
            if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => {
          dbPromise = null;
          reject(req.error);
        };
      });
      return dbPromise;
    }
    function dbTx(stores, fn) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            const t = db.transaction(stores, 'readwrite');
            fn(t);
            t.oncomplete = () => resolve();
            t.onerror = () => reject(t.error);
            t.onabort = () => reject(t.error);
          })
      );
    }
    function dbGetAll(store) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            const req = db.transaction(store, 'readonly').objectStore(store).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
          })
      );
    }
    const dbPut = (store, rec) => dbTx([store], (t) => t.objectStore(store).put(rec));
    const dbPutMany = (store, list) =>
      list.length ? dbTx([store], (t) => list.forEach((r) => t.objectStore(store).put(r))) : Promise.resolve();
    const dbDelete = (store, key) => dbTx([store], (t) => t.objectStore(store).delete(key));
    const dbClearAll = () => dbTx(STORES, (t) => STORES.forEach((s) => t.objectStore(s).clear()));

    function persist(promise) {
      promise.catch(() => toast('Nie udało się zapisać zmian na urządzeniu.'));

    /* ============================================================

    function migrateHabit(h, today) {
      let changed = false;
      const out = { ...h };
      if (!Array.isArray(out.pauses)) {
        out.pauses = [];
        if (out.status === 'paused' || out.status === 'archived') {
          let start = out.updatedAt ? toDateStr(new Date(out.updatedAt)) : today;
          if (start < out.createdAt) start = out.createdAt;
          out.pauses = [{ start, end: null }];
        }
        changed = true;
      }
      if (!out.schedule) {
        out.schedule = { type: 'daily' };
        changed = true;
      }
      return { habit: out, changed };
    }
    function migrateEntry(e) {
      if (!('mode' in e)) return { entry: e, changed: false };
      const out = { ...e };
      if (e.mode === 'time' && e.time) {
        out.time = e.time;
        out.timeOfDay = partOfDay(e.time);
      } else {
        delete out.time;
        out.timeOfDay = e.timeOfDay || 'morning';
      }
      delete out.mode;
      return { entry: out, changed: true };
    }

    /* ============================================================
       Logika nawyków
       ============================================================ */
    function buildMap(completions) {
      const set = new Set();
      for (const c of completions) if (c.completed) set.add(`${c.habitId}_${c.date}`);
      return set;
    }
    const isDone = (id, d, map) => map.has(`${id}_${d}`);
    const isPausedOn = (h, d) => (h.pauses || []).some((p) => d >= p.start && (!p.end || d <= p.end));
    const existsOn = (h, d) => d >= h.createdAt && !isPausedOn(h, d);
    const targetOf = (h) => Math.max(1, Math.min(7, Number(h.schedule?.timesPerWeek) || 1));
    function doneInWeek(h, d, map, ws, exclude) {
      const start = weekStart(d, ws);
      let n = 0;
      for (let i = 0; i < 7; i++) {
        const x = addDays(start, i);
        if (x !== exclude && isDone(h.id, x, map)) n++;
      }
      return n;
    }

    // Czy nawyk „liczy się” w danym dniu (do planu dnia i statystyk).
    function isPlannedOn(h, d, map, ws, today) {
      if (isDone(h.id, d, map)) return true;
      if (!existsOn(h, d)) return false;
      const s = h.schedule || { type: 'daily' };
      if (s.type === 'daily') return true;
      if (s.type === 'specific_days') return (s.daysOfWeek || []).includes(dow(d));
      if (s.type === 'times_per_week') {
        // W przeszłości dzień bez wykonania nie jest pominięciem — liczy się tydzień.
        if (d < today) return false;
        return doneInWeek(h, d, map, ws, d) < targetOf(h);
      }
      return false;
    }

    function habitDayState(h, d, today, map, ws) {
      if (d > today) return 'future';
      if (isDone(h.id, d, map)) return 'done';
      if (d < h.createdAt) return 'before';
      if (isPausedOn(h, d)) return 'paused';
      if (!isPlannedOn(h, d, map, ws, today)) return 'off';
      return d === today ? 'pending' : 'missed';
    }
    const DAY_STATE_LABEL = {
      future: 'jeszcze przed Tobą',
      done: 'wykonany',
      before: 'przed dodaniem nawyku',
      paused: 'wstrzymany',
      off: 'nie zaplanowano',
      pending: 'do zrobienia',
      missed: 'pominięty'

    // Ostatnia zaplanowana okazja przed dziś — jeśli pominięta, zwraca jej datę.
    function missedLast(h, ctx) {
      if (state.settings.neverMissTwiceAlerts === false) return null;
      const s = h.schedule || { type: 'daily' };
      if (s.type === 'times_per_week') return null;
      let d = addDays(ctx.today, -1);
      for (let i = 0; i < 60 && d >= h.createdAt; i++) {
        if (existsOn(h, d) && isPlannedOn(h, d, ctx.map, ctx.ws, ctx.today)) {
          return isDone(h.id, d, ctx.map) ? null : d;
        }
        d = addDays(d, -1);
      }
      return null;

    const missedLabel = (d, today) => (d === addDays(today, -1) ? 'wczoraj' : weekdayIn(d));

    function habitStats(h, today, map, ws) {
      const s = h.schedule || { type: 'daily' };
      if (s.type === 'times_per_week') {
        const target = targetOf(h);
        const current = weekStart(today, ws);
        let w = weekStart(h.createdAt, ws);
        let run = 0;
        let best = 0;
        for (let guard = 0; w <= current && guard < 800; guard++) {
          let n = 0;
          let existed = false;
          for (let i = 0; i < 7; i++) {
            const x = addDays(w, i);
            if (isDone(h.id, x, map)) n++;
            if (x <= today && existsOn(h, x)) existed = true;
          }
          if (n >= target) {
            run++;
            best = Math.max(best, run);
          } else if (w !== current && existed) {
            run = 0;
          }
          w = addDays(w, 7);
        }
        return { unit: 'week', current: run, best, thisWeek: doneInWeek(h, today, map, ws, null), target };
      }
      let run = 0;
      let best = 0;
      let d = h.createdAt;
      for (let guard = 0; d <= today && guard < 5000; guard++) {
        if (isPlannedOn(h, d, map, ws, today)) {
          if (isDone(h.id, d, map)) {
            run++;
            best = Math.max(best, run);
          } else if (d !== today) {
            run = 0;
          }
        }
        d = addDays(d, 1);
      }
      return { unit: 'day', current: run, best };
    }

    function monthRate(h, y, m, today, map, ws) {
      let plan = 0;
      let done = 0;
      for (const d of monthDays(y, m)) {
        if (d > today) break;
        if (!isPlannedOn(h, d, map, ws, today)) continue;
        const ok = isDone(h.id, d, map);
        if (d === today && !ok) continue;
        plan++;
        if (ok) done++;
      }
      return { plan, done, rate: plan ? Math.round((done / plan) * 100) : null };
    }

    function sortHabits(a, b) {
      if (Boolean(a.important) !== Boolean(b.important)) return a.important ? -1 : 1;
      const ta = a.executionTime || '99:99';
      const tb = b.executionTime || '99:99';
      if (ta !== tb) return ta.localeCompare(tb);
      return a.name.localeCompare(b.name, 'pl');
    }

    function daySummary(d, ctx) {
      const { today, map, ws } = ctx;
      const isFuture = d > today;
      const isToday = d === today;
      const items = [];
      for (const h of state.habits) {
        if ((isToday || isFuture) && h.status !== 'active') continue;
        if (isPlannedOn(h, d, map, ws, today)) items.push({ habit: h, done: isDone(h.id, d, map) });
      }
      items.sort((a, b) => sortHabits(a.habit, b.habit));
      const done = items.filter((i) => i.done).length;
      return {
        date: d,
        isFuture,
        isToday,
        items,
        total: items.length,
        done,
        ratio: !isFuture && items.length ? done / items.length : null

    }

    function scheduleLabel(s) {
      if (!s || s.type === 'daily') return 'Codziennie';
      if (s.type === 'specific_days') {
        const days = s.daysOfWeek || [];
        if (days.length === 7) return 'Codziennie';
        if (days.length === 5 && [1, 2, 3, 4, 5].every((d) => days.includes(d))) return 'Dni robocze';
        if (days.length === 2 && days.includes(0) && days.includes(6)) return 'Weekendy';
        return WEEKDAYS.filter((w) => days.includes(w.d)).map((w) => w.s).join(', ') || 'Wybrane dni';
