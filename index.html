    /* ============================================================
       Morfowanie DOM — zachowuje fokus, przewijanie i przejścia CSS
       ============================================================ */
    const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute('data-key') : null);
    function patchChildren(parent, next) {
      const incoming = Array.from(next.childNodes);
      const keyed = new Map();
      for (const o of Array.from(parent.childNodes)) {
        const k = keyOf(o);
        if (k) keyed.set(k, o);
      }
      let i = 0;
      for (const n of incoming) {
        const cur = parent.childNodes[i] || null;
        const k = keyOf(n);
        if (k) {
          const match = keyed.get(k);
          if (match && match.nodeName === n.nodeName) {
            if (match !== cur) parent.insertBefore(match, cur);
            keyed.delete(k);
            patchNode(match, n);
            i++;
            continue;
          }
        } else if (cur && !keyOf(cur) && cur.nodeType === n.nodeType && cur.nodeName === n.nodeName) {
          patchNode(cur, n);
          i++;
          continue;
        } else if (cur && n.nodeType === 1) {
          // Element zniknął przed nami? Szukamy pasującego węzła kilka pozycji dalej,
          // żeby nie przebudowywać wszystkiego, co jest niżej (i nie gubić kliknięć).
          const cls = n.getAttribute('class');
          let probe = cur.nextSibling;
          for (let step = 0; probe && step < 8; step++) {
            if (probe.nodeType === 1 && !keyOf(probe) && probe.nodeName === n.nodeName && probe.getAttribute('class') === cls) break;
            probe = probe.nextSibling;
          }
          if (probe && probe.nodeType === 1 && probe.nodeName === n.nodeName && probe.getAttribute('class') === cls) {
            let x = cur;
            while (x !== probe) {
              const nx = x.nextSibling;
              parent.removeChild(x); // węzły z kluczem zostają w mapie i mogą wrócić niżej
              x = nx;
            }
            patchNode(probe, n);
            i++;
            continue;
          }
        }
        parent.insertBefore(n, cur);
        i++;
      }
      while (parent.childNodes.length > i) parent.removeChild(parent.lastChild);
    }
    function patchNode(a, b) {
      if (a.nodeType !== 1) {
        if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
        return;
      }
      const keepStyle = a.hasAttribute('data-keep-style');
      for (const attr of Array.from(a.attributes)) {
        if (keepStyle && attr.name === 'style') continue;
        if (!b.hasAttribute(attr.name)) a.removeAttribute(attr.name);
      }
      for (const attr of Array.from(b.attributes)) {
        if (keepStyle && attr.name === 'style') continue;
        if (a.getAttribute(attr.name) !== attr.value) a.setAttribute(attr.name, attr.value);
      }
      const tag = a.nodeName;
      if (tag === 'INPUT') {
        const v = b.getAttribute('value') ?? '';
        if (document.activeElement !== a && a.value !== v) a.value = v;
        return;
      }
      if (tag === 'TEXTAREA') {
        if (document.activeElement !== a && a.value !== b.textContent) a.value = b.textContent;
        return;
      }
      patchChildren(a, b);
      if (tag === 'SELECT') {
        const sel = b.querySelector('option[selected]');
        const v = sel ? sel.getAttribute('value') : '';
        if (document.activeElement !== a && a.value !== v) a.value = v;
      }
    }
    function morph(root, html) {
      const tpl = document.createElement('template');
      tpl.innerHTML = html;
      patchChildren(root, tpl.content);
    }

    /* ============================================================
       Renderowanie
       ============================================================ */
    const appRoot = document.getElementById('app');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function render() {
      if (!state.ready) {
        if (state.error) {
          appRoot.innerHTML = `<main style="padding-top:4rem"><section class="card empty"><h2>Nie udało się otworzyć danych</h2><p>${esc(state.error)}</p></section></main>`;
        }
        return;
      }
      const ctx = ctxNow();
      const blocked = Boolean(state.sheet || state.menu);
      const html = `
        ${renderTopbar(ctx, blocked)}
        <div class="page" data-key="page-${state.tab}" ${blocked ? 'inert' : ''}>
          ${renderLargeTitle(ctx)}
          <main>${renderView(ctx)}</main>
        </div>
        ${renderTabbar(blocked)}
        ${state.menu ? renderMenu() : ''}
        ${state.sheet ? renderSheet(ctx) : ''}
        <div class="toast-host" role="status" aria-live="polite" data-key="toast-host">${state.toast ? renderToast() : ''}</div>`;
      morph(appRoot, html);
      afterRender();
    }

    const yearScrolled = new WeakSet();
    function afterRender() {
      document.documentElement.classList.toggle('locked', Boolean(state.sheet));
      const ys = appRoot.querySelector('[data-year-scroll]');
      if (ys && !yearScrolled.has(ys)) {
        ys.scrollLeft = ys.scrollWidth;
        yearScrolled.add(ys);
      }
      if (state.sheet && state.sheet.focusPending) {
        state.sheet.focusPending = false;
        const t = appRoot.querySelector('#sheet-title');
        if (t) t.focus({ preventScroll: true });
      }
      if (state.menu && state.menuFocus) {
        state.menuFocus = false;
        const first = appRoot.querySelector('.menu [role="menuitem"]');
        if (first) first.focus({ preventScroll: true });
      }
      updateScrolled();
    }

    function updateScrolled() {
      document.documentElement.classList.toggle('scrolled', window.scrollY > 36);
    }
    let scrollTick = false;
    window.addEventListener(
      'scroll',
      () => {
        if (scrollTick) return;
        scrollTick = true;
        requestAnimationFrame(() => {
          scrollTick = false;
          updateScrolled();
        });
      },
      { passive: true }
    );

    const navIcon = (action, ic, label, extra = '') =>
      `<button type="button" class="nav-btn icon" data-action="${action}" aria-label="${label}" ${extra}>${icon(ic)}</button>`;

    function renderTopbar(ctx, blocked) {
      let title = '';
      let end = '';
      if (state.tab === 'today') {
        title = 'Dzisiaj';
        end = navIcon('add-habit', 'plus', 'Dodaj nawyk');
      } else if (state.tab === 'habits') {
        title = 'Nawyki';
        end = navIcon('add-habit', 'plus', 'Dodaj nawyk');
      } else if (state.tab === 'planner') {
        title = 'Planer';
        end = `${
          state.planner.date !== ctx.today
            ? '<button type="button" class="nav-btn" data-action="planner-today">Dziś</button>'
            : ''
        }${navIcon('planner-menu', 'plus', 'Dodaj', `aria-haspopup="menu" aria-expanded="${state.menu === 'planner'}"`)}`;
      } else {
        title = 'Ustawienia';
      }
      return `<header class="topbar" data-key="topbar" ${blocked ? 'inert' : ''}>
        <div class="topbar-inner">
          <div class="topbar-side"></div>
          <div class="topbar-title" aria-hidden="true">${title}</div>
          <div class="topbar-side end">${end}</div>
        </div>
      </header>`;
    }

    function renderLargeTitle(ctx) {
      let h = '';
      let p = '';
      if (state.tab === 'today') {
        h = 'Dzisiaj';
        p = longDate(ctx.today);
      } else if (state.tab === 'habits') {
        h = 'Nawyki';
      } else if (state.tab === 'planner') {
        h = 'Planer';
        p = longDate(state.planner.date) + (state.planner.date === ctx.today ? ' · dziś' : '');
      } else {
        h = 'Ustawienia';
      }
      return `<div class="large-title"><h1>${h}</h1>${p ? `<p>${esc(p)}</p>` : ''}</div>`;
    }

    const TABS = [
      ['today', 'Dzisiaj', 'tabToday'],
      ['habits', 'Nawyki', 'tabHabits'],
      ['planner', 'Planer', 'tabPlanner'],
      ['settings', 'Ustawienia', 'tabSettings']
    ];
    function renderTabbar(blocked) {
      return `<nav class="tabbar" aria-label="Sekcje" data-key="tabbar" ${blocked ? 'inert' : ''}>
        <div class="tabbar-inner">
          ${TABS.map(
            ([id, label, ic]) =>
              `<button type="button" class="tab" data-action="tab" data-tab="${id}" ${
                state.tab === id ? 'aria-current="page"' : ''
              }>${icon(ic)}<span>${label}</span></button>`
          ).join('')}
        </div>
      </nav>`;
    }

    function renderView(ctx) {
      if (state.tab === 'today') return viewToday(ctx);
      if (state.tab === 'habits') return viewHabits(ctx);
      if (state.tab === 'planner') return viewPlanner(ctx);
      return viewSettings(ctx);
    }

    function segmented(opts, value, action, label, disabled = false) {
      const i = Math.max(0, opts.findIndex((o) => o[0] === value));
      return `<div class="seg" role="group" aria-label="${esc(label)}" style="--n:${opts.length};--i:${i}">
        <span class="seg-thumb" aria-hidden="true"></span>
        ${opts
          .map(
            ([v, l]) =>
              `<button type="button" data-action="${action}" data-value="${v}" aria-pressed="${v === value}" ${
                disabled ? 'disabled' : ''
              }>${l}</button>`
          )
          .join('')}
      </div>`;
    }

    function switchRow(title, sub, checked, action, key, disabled = false) {
      return `<li class="row">
        <span class="row-text" id="sw-${key}">
          <span class="row-title">${title}</span>
          ${sub ? `<span class="row-meta">${sub}</span>` : ''}
        </span>
        <button type="button" class="switch" role="switch" aria-checked="${Boolean(checked)}" aria-labelledby="sw-${key}"
          data-action="${action}" data-key="${key}" ${disabled ? 'disabled' : ''}></button>
      </li>`;
    }

    function actionRow(title, action, { sub = '', tone = 'accent', attrs = '', key = '' } = {}) {
      return `<li ${key ? `data-key="${key}"` : ''}><div class="row">
        <button type="button" class="row-main" data-action="${action}" ${attrs}>
          <span class="row-text">
            <span class="row-title ${tone}">${title}</span>
            ${sub ? `<span class="row-meta">${sub}</span>` : ''}
          </span>
        </button>
      </div></li>`;
    }

    const checkRing = () => `<span class="check-ring">${icon('check')}</span>`;

    function periodStrips(d) {
      const list = periodsOn(d);
      if (!list.length) return '';
      return `<div class="strips">${list
        .map(
          (p) => `<button type="button" class="strip pc-${safeColor(p.color)}" data-action="edit-period" data-id="${esc(
            p.id
          )}" data-key="ps-${esc(p.id)}">
            <span class="dot-pc" aria-hidden="true"></span>
            <span class="strip-text"><strong>${esc(p.name)}</strong> · ${dateRange(p.startDate, p.endDate)}${
            p.note ? `<span class="strip-note">${esc(p.note)}</span>` : ''
          }</span>
            ${icon('chevR', 'chev')}
          </button>`
        )
        .join('')}</div>`;
    }

    function renderCalendar({ y, m, ws, nav, cell }) {
      const cells = calendarCells(y, m, ws);
      return `<div class="cal-head">
          <h2 class="cal-month">${monthYear(y, m)}</h2>
          <div class="cal-nav">
            <button type="button" data-action="${nav}" data-dir="-1" aria-label="Poprzedni miesiąc">${icon('chevL')}</button>
            <button type="button" data-action="${nav}" data-dir="1" aria-label="Następny miesiąc">${icon('chevR')}</button>
          </div>
        </div>
        <div class="cal-grid" role="group" aria-label="${monthYear(y, m)}">
          ${orderedDays(ws).map((d) => `<div class="cal-dow" aria-hidden="true">${d.s}</div>`).join('')}
          ${cells.map((c, i) => cell(c.date, c.inMonth, i % 7)).join('')}
        </div>`;
    }

    /* ---------- Dzisiaj ---------- */
    function emptyNoHabits() {
      return `<section class="card empty">
        <h2>Nie masz jeszcze nawyków</h2>
        <p>Dodaj pierwszy, a pojawi się tutaj w każdym dniu, w którym go zaplanujesz.</p>
        <button type="button" class="btn btn-filled" data-action="add-habit">Dodaj nawyk</button>
      </section>`;
    }

    function viewToday(ctx) {
      if (!state.habits.length) return periodStrips(ctx.today) + emptyNoHabits();
      const active = state.habits.filter((h) => h.status === 'active');
      if (!active.length) {
        return `${periodStrips(ctx.today)}<section class="card empty">
          <h2>Brak aktywnych nawyków</h2>
          <p>Wszystkie nawyki są wstrzymane albo w archiwum.</p>
          <button type="button" class="btn btn-tinted" data-action="tab" data-tab="habits">Pokaż nawyki</button>
        </section>`;
      }
      const sum = daySummary(ctx.today, ctx);
      const off = active.filter((h) => !sum.items.some((i) => i.habit.id === h.id)).sort(sortHabits);
      return `${periodStrips(ctx.today)}
        ${progressCard(sum)}
        ${
          sum.items.length
            ? `<section class="section">
                <div class="section-head"><h2 class="section-title">Na dziś</h2></div>
                <ul class="card list with-check">${sum.items.map((it) => todayRow(it, ctx)).join('')}</ul>
              </section>`
            : ''
        }
        ${
          off.length
            ? `<section class="section">
                <div class="section-head"><h2 class="section-title">Nie dziś</h2></div>
                <ul class="card list">
                  ${off
                    .map(
                      (h) => `<li data-key="off-${esc(h.id)}"><div class="row">
                        <button type="button" class="row-main" data-action="open-detail" data-id="${esc(h.id)}">
                          <span class="row-text">
                            <span class="row-title muted">${esc(h.name)}</span>
                            <span class="row-meta">${esc(scheduleLabel(h.schedule))}</span>
                          </span>
                          ${icon('chevR', 'chev')}
                        </button>
                      </div></li>`
                    )
                    .join('')}
                </ul>
              </section>`
            : ''
        }`;
    }

    function progressCard(s) {
      if (!s.total) {
        return `<section class="card progress"><div class="progress-plain">Na dziś nic nie zaplanowano</div></section>`;
      }
      const pct = Math.round((s.done / s.total) * 100);
      const left = s.total - s.done;
      const C = 2 * Math.PI * 22;
      const note =
        left === 0
          ? 'Wszystko na dziś zrobione'
          : `${plural(left, 'Został', 'Zostały', 'Zostało')} ${left} ${plural(left, 'nawyk', 'nawyki', 'nawyków')}`;
      return `<section class="card progress" aria-label="Postęp dnia">
        <div>
          <div class="progress-count">${s.done}<span class="of"> z ${s.total}</span></div>
          <div class="progress-note">${note}</div>
        </div>
        <div class="ring ${left === 0 ? 'full' : ''} ${pct === 0 ? 'zero' : ''}" aria-hidden="true">
          <svg viewBox="0 0 52 52">
            <circle class="ring-track" cx="26" cy="26" r="22" fill="none" stroke-width="5"/>
            <circle class="ring-value" cx="26" cy="26" r="22" fill="none" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(2)}"/>
          </svg>
          <span class="ring-label">${pct}%</span>
        </div>
      </section>`;
    }

    function todayRow({ habit: h, done }, ctx) {
      const missed = !done ? missedLast(h, ctx) : null;
      const cls = ['check', !done && missed ? 'is-missed' : '', !done && h.important ? 'is-important' : '']
        .filter(Boolean)
        .join(' ');
      const meta = [
        h.executionTime ? `<span class="meta-item">${icon('clock')}${esc(h.executionTime)}</span>` : '',
        h.note ? `<span>${esc(h.note)}</span>` : '',
        missed ? `<span class="meta-alert">Pominięty ${missedLabel(missed, ctx.today)}</span>` : ''
      ].join('');
      return `<li data-key="t-${esc(h.id)}"><div class="row ${done ? 'is-done' : ''}">
        <button type="button" class="${cls}" role="checkbox" aria-checked="${done}" data-action="toggle-today"
          data-id="${esc(h.id)}" aria-label="${esc(h.name)}${h.important ? ', ważny' : ''}">${checkRing()}</button>
        <button type="button" class="row-main" data-action="open-detail" data-id="${esc(h.id)}">
          <span class="row-text">
            <span class="row-title">${esc(h.name)}</span>
            ${meta ? `<span class="row-meta">${meta}</span>` : ''}
          </span>
          ${icon('chevR', 'chev')}
        </button>
      </div></li>`;
    }

    /* ---------- Nawyki (historia + lista) ---------- */
    function viewHabits(ctx) {
      if (!state.habits.length) return emptyNoHabits();
      const mode = state.history.mode;
      return `<div class="seg-wrap">${segmented(
        [
          ['year', 'Rok'],
          ['month', 'Miesiąc']
        ],
        mode,
        'history-mode',
        'Zakres historii'
      )}</div>
        <div class="section">
          ${mode === 'year' ? yearCard(ctx) : monthHistoryCard(ctx)}
          ${historyDayCard(ctx)}
        </div>
        ${habitLists(ctx)}`;
    }

    function levelOf(s) {
      if (s.isFuture) return 'future';
      if (!s.total || s.ratio === null) return '';
      if (s.ratio === 0) return '0';
      if (s.ratio < 0.5) return '1';
      if (s.ratio < 1) return '2';
      return '3';
    }

    function yearCard(ctx) {
      const end = weekStart(ctx.today, ctx.ws);
      const first = addDays(end, -51 * 7);
      let months = '';
      let cells = '';
      let lastMonth = parseDate(first).getMonth();
      for (let w = 0; w < 52; w++) {
        const start = addDays(first, w * 7);
        const lastDay = parseDate(addDays(start, 6));
        const mm = lastDay.getMonth();
        const label = mm !== lastMonth ? cap(fmtMonthShort.format(lastDay).replace('.', '')) : '';
        lastMonth = mm;
        months += `<span>${label}</span>`;
        for (let d = 0; d < 7; d++) {
          const ds = addDays(start, d);
          const s = daySummary(ds, ctx);
          const lv = levelOf(s);
          const cls = [
            'yc',
            lv === 'future' ? 'future' : lv ? `l${lv}` : '',
            ds === ctx.today ? 'today' : '',
            ds === state.history.date && ds !== ctx.today ? 'sel' : ''
          ]
            .filter(Boolean)
            .join(' ');
          cells += `<button type="button" class="${cls}" tabindex="-1" data-action="history-select" data-date="${ds}"></button>`;
        }
      }
      return `<section class="card year">
        <div class="card-head"><h2 class="card-title">Ostatni rok</h2></div>
        <div class="year-scroll" data-year-scroll aria-hidden="true">
          <div class="year-months">${months}</div>
          <div class="year-grid">${cells}</div>
        </div>
        <p class="sr-only">Siatka roku jest dostępna wizualnie. Z czytnikiem ekranu wygodniejszy jest widok Miesiąc.</p>
        <div class="year-foot" aria-hidden="true">Mniej <i class="yc"></i><i class="yc l1"></i><i class="yc l2"></i><i class="yc l3"></i> Więcej</div>
      </section>`;
    }

    function monthHistoryCard(ctx) {
      const H = state.history;
      const cal = renderCalendar({
        y: H.y,
        m: H.m,
        ws: ctx.ws,
        nav: 'history-month',
        cell: (ds, inMonth, col) => {
          const s = daySummary(ds, ctx);
          const lv = levelOf(s);
          const band = bandFor(ds, col);
          const sel = ds === H.date;
          const cls = [
            'cal-day',
            inMonth ? '' : 'outside',
            ds === ctx.today ? 'is-today' : '',
            lv && lv !== 'future' && lv !== '0' ? `lv-${lv}` : '',
            sel ? 'sel' : ''
          ]
            .filter(Boolean)
            .join(' ');
          const label = `${longDate(ds)}${band.name ? `, ${band.name}` : ''}${
            s.total && !s.isFuture ? `, wykonano ${s.done} z ${s.total}` : ''
          }`;
          return `<div class="cal-cell ${band.cls}"><button type="button" class="${cls}" data-action="history-select"
            data-date="${ds}" aria-pressed="${sel}" aria-label="${esc(label)}" ${
            ds === ctx.today ? 'aria-current="date"' : ''
          }>${parseDate(ds).getDate()}</button></div>`;
        }
      });
      return `<section class="card">${cal}
        <div class="cal-legend" aria-hidden="true">
          <span><i class="legend-sw" style="background:var(--lvl-1)"></i>Część</span>
          <span><i class="legend-sw" style="background:var(--lvl-3)"></i>Wszystko</span>
        </div>
      </section>`;
    }

    function historyDayCard(ctx) {
      const d = state.history.date;
      const s = daySummary(d, ctx);
      const periods = periodsOn(d);
      let body;
      if (s.isFuture) body = `<p class="card-empty">Ten dzień jeszcze nie nadszedł.</p>`;
      else if (!s.total) body = `<p class="card-empty">Tego dnia nic nie zaplanowano.</p>`;
      else {
        body = `<ul class="list with-check">${s.items
          .map(
            ({ habit: h, done }) => `<li data-key="hd-${esc(h.id)}"><div class="row ${done ? 'is-done' : ''}">
              <button type="button" class="check" role="checkbox" aria-checked="${done}" data-action="toggle-day"
                data-id="${esc(h.id)}" data-date="${d}" aria-label="${esc(h.name)}, ${esc(longDate(d))}">${checkRing()}</button>
              <button type="button" class="row-main" data-action="open-detail" data-id="${esc(h.id)}">
                <span class="row-text">
                  <span class="row-title">${esc(h.name)}</span>
                  <span class="row-meta">${done ? 'Wykonany' : s.isToday ? 'Do zrobienia' : 'Pominięty'}</span>
                </span>
                ${icon('chevR', 'chev')}
              </button>
            </div></li>`
          )
          .join('')}</ul>`;
      }
      return `<section class="card" style="margin-top:1rem">
        <div class="card-head">
          <div>
            <h2 class="card-title">${esc(longDate(d))}</h2>
            ${
              periods.length
                ? `<p class="card-sub">${periods.map((p) => esc(p.name)).join(', ')}</p>`
                : d === ctx.today
                ? '<p class="card-sub">Dzisiaj</p>'
                : ''
            }
          </div>
          ${!s.isFuture && s.total ? `<span class="badge">${s.done} z ${s.total}</span>` : ''}
        </div>
        ${body}
      </section>`;
    }

    function habitLists(ctx) {
      const groups = [
        ['active', 'Aktywne'],
        ['paused', 'Wstrzymane'],
        ['archived', 'W archiwum']
      ];
      return groups
        .map(([status, label]) => {
          const list = state.habits.filter((h) => h.status === status).sort((a, b) => a.name.localeCompare(b.name, 'pl'));
          if (!list.length) return '';
          return `<section class="section">
            <div class="section-head"><h2 class="section-title">${label}</h2></div>
            <ul class="card list">${list
              .map((h) => {
                const st = habitStats(h, ctx.today, ctx.map, ctx.ws);
                const streak = st.current ? ` · Seria: ${st.current}${st.unit === 'week' ? ' tyg.' : ''}` : '';
                return `<li data-key="hl-${esc(h.id)}"><div class="row">
                  <button type="button" class="row-main" data-action="open-detail" data-id="${esc(h.id)}">
                    <span class="row-text">
                      <span class="row-title">${esc(h.name)}</span>
                      <span class="row-meta">${esc(scheduleLabel(h.schedule))}${streak}</span>
                    </span>
                    ${icon('chevR', 'chev')}
                  </button>
                </div></li>`;
              })
              .join('')}</ul>
          </section>`;
        })
        .join('');
    }

    /* ---------- Planer ---------- */
    const PARTS = [
      ['morning', 'Rano'],
      ['afternoon', 'Popołudnie'],
      ['evening', 'Wieczór']
    ];

    function entriesByDate() {
      const map = new Map();
      for (const e of state.entries) {
        const list = map.get(e.date) || [];
        list.push(e);
        map.set(e.date, list);
      }
      return map;
    }
    function sortEntries(list) {
      return [...list].sort((a, b) => {
        if (Boolean(a.time) !== Boolean(b.time)) return a.time ? 1 : -1;
        if (a.time && b.time && a.time !== b.time) return a.time.localeCompare(b.time);
        return (a.order || 0) - (b.order || 0);
      });
    }

    function viewPlanner(ctx) {
      const P = state.planner;
      const byDate = entriesByDate();
      const cal = renderCalendar({
        y: P.y,
        m: P.m,
        ws: ctx.ws,
        nav: 'planner-month',
        cell: (ds, inMonth, col) => {
          const has = (byDate.get(ds) || []).length > 0;
          let allDone = false;
          if (ds <= ctx.today) {
            const s = daySummary(ds, ctx);
            allDone = s.total > 0 && s.done === s.total;
          }
          const band = bandFor(ds, col);
          const sel = ds === P.date;
          const cls = ['cal-day', 'pick', inMonth ? '' : 'outside', ds === ctx.today ? 'is-today' : ''].filter(Boolean).join(' ');
          const label = `${longDate(ds)}${band.name ? `, ${band.name}` : ''}${has ? ', są wpisy' : ''}${
            allDone ? ', wszystkie nawyki wykonane' : ''
          }`;
          return `<div class="cal-cell ${band.cls}"><button type="button" class="${cls}" data-action="planner-select"
            data-date="${ds}" aria-pressed="${sel}" aria-label="${esc(label)}" ${ds === ctx.today ? 'aria-current="date"' : ''}>
            <span>${parseDate(ds).getDate()}</span>
            <span class="cal-dots" aria-hidden="true">${has ? '<i class="dot"></i>' : ''}${
            allDone ? '<i class="dot green"></i>' : ''
          }</span>
          </button></div>`;
        }
      });

      const monthPeriods = periodsInMonth(P.y, P.m);
      const dayEntries = byDate.get(P.date) || [];
      const editing = P.editing && dayEntries.length > 0;

      const groups = PARTS.map(([part, label]) => {
        const items = sortEntries(dayEntries.filter((e) => (e.timeOfDay || 'morning') === part));
        const untimed = items.filter((e) => !e.time);
        return `<div class="plan-group">
          <div class="plan-head">
            <h3>${label}</h3>
            <button type="button" class="icon-btn" data-action="new-entry" data-part="${part}" aria-label="Dodaj wpis: ${label}">${icon(
          'plus'
        )}</button>
          </div>
          ${
            items.length
              ? `<ul class="list ${editing ? '' : 'with-check'}">${items
                  .map((e) => entryRow(e, editing, untimed))
                  .join('')}</ul>`
              : ''
          }
        </div>`;
      }).join('');

      return `<section class="card section" style="overflow:hidden">
          ${cal}
          <div class="cal-legend" aria-hidden="true">
            <span><i class="dot"></i>Plan</span>
            <span><i class="dot green"></i>Wszystkie nawyki</span>
          </div>
          ${
            monthPeriods.length
              ? `<div class="cal-periods">
                  <h3 class="mini-title">Okresy w tym miesiącu</h3>
                  <ul>${monthPeriods
                    .map(
                      (p) => `<li data-key="mp-${esc(p.id)}"><button type="button" class="mini-row pc-${safeColor(
                        p.color
                      )}" data-action="edit-period" data-id="${esc(p.id)}">
                        <span class="dot-pc" aria-hidden="true"></span>
                        <span class="mini-name">${esc(p.name)}</span>
                        <span class="mini-range">${dateRange(p.startDate, p.endDate)}</span>
                      </button></li>`
                    )
                    .join('')}</ul>
                </div>`
              : ''
          }
        </section>
        ${periodStrips(P.date)}
        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Plan dnia</h2>
            ${
              dayEntries.length
                ? `<button type="button" class="section-action" data-action="planner-edit" aria-pressed="${editing}">${
                    editing ? 'Gotowe' : 'Edytuj'
                  }</button>`
                : ''
            }
          </div>
          <div class="card">
            ${dayEntries.length ? '' : '<p class="plan-empty">Nic nie zaplanowano.</p>'}
            ${groups}
          </div>
        </section>`;
    }

    function entryRow(e, editing, untimed) {
      const linked = e.linkedHabitId ? findHabit(e.linkedHabitId) : null;
      const meta = [
        e.description ? `<span>${esc(e.description)}</span>` : '',
        linked ? `<span class="meta-item">${icon('repeat')}${esc(linked.name)}</span>` : ''
      ].join('');
      const idx = untimed.indexOf(e);
      const lead = editing
        ? `<button type="button" class="icon-btn del" data-action="entry-delete" data-id="${esc(e.id)}" aria-label="Usuń: ${esc(
            e.content
          )}"><span>${icon('minus')}</span></button>`
        : `<button type="button" class="check square" role="checkbox" aria-checked="${Boolean(
            e.done
          )}" data-action="entry-toggle" data-id="${esc(e.id)}" aria-label="${esc(e.content)}">${checkRing()}</button>`;
      const reorder =
        editing && !e.time
          ? `<span class="reorder">
              <button type="button" class="icon-btn" data-action="entry-move" data-id="${esc(e.id)}" data-dir="-1"
                aria-label="Przesuń wyżej: ${esc(e.content)}" ${idx <= 0 ? 'disabled' : ''}>${icon('up')}</button>
              <button type="button" class="icon-btn" data-action="entry-move" data-id="${esc(e.id)}" data-dir="1"
                aria-label="Przesuń niżej: ${esc(e.content)}" ${idx >= untimed.length - 1 ? 'disabled' : ''}>${icon('down')}</button>
            </span>`
          : '';
      return `<li data-key="e-${esc(e.id)}"><div class="row ${e.done ? 'is-done' : ''}">
        ${lead}
        <button type="button" class="row-main" data-action="edit-entry" data-id="${esc(e.id)}">
          ${e.time ? `<span class="time-tag">${esc(e.time)}</span>` : ''}
          <span class="row-text">
            <span class="row-title">${esc(e.content)}</span>
            ${meta ? `<span class="row-meta">${meta}</span>` : ''}
          </span>
          ${editing ? '' : icon('chevR', 'chev')}
        </button>
        ${reorder}
      </div></li>`;
    }

    /* ---------- Ustawienia ---------- */
    function notifEnv() {
      const ua = navigator.userAgent || '';
      const iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const supported = 'Notification' in window;
      return { iOS, standalone, supported, permission: supported ? Notification.permission : 'unsupported' };
    }
    function notifStatusText(env) {
      if (!env.supported) {
        return env.iOS && !env.standalone
          ? 'Dostępne po dodaniu Rutyny do ekranu początkowego'
          : 'Niedostępne w tej przeglądarce';
      }
      if (env.permission === 'denied') return 'Zablokowane w ustawieniach systemu';
      if (env.permission === 'granted' && state.settings.notificationsEnabled) return 'Włączone';
      return 'Wyłączone';
    }
    const calendarHabits = () =>
      state.habits.filter((h) => h.status === 'active' && ((h.reminder?.enabled && h.reminder.time) || h.executionTime));

    function viewSettings() {
      const s = state.settings;
      const env = notifEnv();
      const notifOn = Boolean(s.notificationsEnabled && env.permission === 'granted');
      const calCount = calendarHabits().length;
      const periods = [...state.periods].sort((a, b) => a.startDate.localeCompare(b.startDate));

      return `
        <div class="group">
          <h2 class="group-label">Wygląd</h2>
          <div class="card"><div class="settings-seg">${segmented(
            [
              ['system', 'Automatyczny'],
              ['light', 'Jasny'],
              ['dark', 'Ciemny']
            ],
            s.theme,
            'set-theme',
            'Motyw'
          )}</div></div>
        </div>

        <div class="group">
          <h2 class="group-label">Kalendarz</h2>
          <ul class="card list">
            <li class="row">
              <span class="row-text"><span class="row-title">Pierwszy dzień tygodnia</span></span>
              ${segmented(
                [
                  ['1', 'Pn'],
                  ['0', 'Nd']
                ],
                String(Number(s.weekStartsOn) === 0 ? 0 : 1),
                'set-week',
                'Pierwszy dzień tygodnia'
              )}
            </li>
            ${switchRow(
              'Okresy w kalendarzu',
              'Tło dni wyjazdu, urlopu itp.',
              s.showPeriodsOnCalendar !== false,
              'toggle-setting',
              'showPeriodsOnCalendar'
            )}
            ${switchRow(
              'Wyróżniaj pominięte',
              'Gdy nawyk pominięto ostatnim razem',
              s.neverMissTwiceAlerts !== false,
              'toggle-setting',
              'neverMissTwiceAlerts'
            )}
          </ul>
        </div>

        <div class="group">
          <h2 class="group-label">Przypomnienia</h2>
          <ul class="card list">
            ${switchRow('Powiadomienia', esc(notifStatusText(env)), notifOn, 'notifications-toggle', 'notifications')}
            ${notifOn ? actionRow('Wyślij próbne powiadomienie', 'notify-test') : ''}
            ${actionRow('Dodaj przypomnienia do Kalendarza', 'calendar-export', {
              sub:
                calCount > 0
                  ? `${calCount} ${plural(calCount, 'nawyk', 'nawyki', 'nawyków')} z godziną`
                  : 'Ustaw godzinę przy nawyku, aby go tu uwzględnić',
              attrs: calCount ? '' : 'disabled'
            })}
          </ul>
          <p class="group-note">Powiadomienie pojawi się o ustawionej godzinie, gdy Rutyna jest otwarta lub niedawno używana — iOS usypia aplikacje w tle. Przypomnienia dodane do Kalendarza działają zawsze, ale nie zmieniają się razem z nawykami.</p>
        </div>

        <div class="group">
          <h2 class="group-label">Okresy</h2>
          <ul class="card list">
            ${periods
              .map(
                (p) => `<li data-key="sp-${esc(p.id)}"><div class="row">
                  <button type="button" class="row-main pc-${safeColor(p.color)}" data-action="edit-period" data-id="${esc(p.id)}">
                    <span class="dot-pc" aria-hidden="true"></span>
                    <span class="row-text">
                      <span class="row-title">${esc(p.name)}</span>
                      <span class="row-meta">${dateRange(p.startDate, p.endDate)} ${parseDate(p.endDate).getFullYear()}</span>
                    </span>
                    ${icon('chevR', 'chev')}
                  </button>
                </div></li>`
              )
              .join('')}
            ${actionRow('Dodaj okres', 'new-period', { key: 'sp-add' })}
          </ul>
        </div>

        <div class="group">
          <h2 class="group-label">Dane</h2>
          <ul class="card list">
            ${actionRow('Zapisz kopię', 'export-json', { sub: 'Plik JSON ze wszystkimi danymi' })}
            ${actionRow('Przywróć z kopii', 'import-json')}
            ${actionRow('Eksportuj nawyki', 'csv-habits', { sub: 'Arkusz CSV dla Excela i Numbers' })}
            ${actionRow('Eksportuj plan i okresy', 'csv-planner', { sub: 'Arkusz CSV dla Excela i Numbers' })}
          </ul>
          <p class="group-note">Wszystko jest zapisane tylko na tym urządzeniu. Przed usunięciem Rutyny z ekranu początkowego zapisz kopię — inaczej dane przepadną.</p>
        </div>

        <div class="group">
          <ul class="card list">${actionRow('Usuń wszystkie dane', 'clear-all', { tone: 'danger' })}</ul>
        </div>

        <p class="app-foot">Rutyna ${APP_VERSION}</p>`;
    }

    /* ---------- Menu ---------- */
    function renderMenu() {
      return `<div class="menu-layer" data-key="menu-layer">
        <div class="menu-dismiss" data-action="menu-close"></div>
        <div class="menu" role="menu" aria-label="Dodaj">
          <button type="button" role="menuitem" data-action="new-entry">Nowy wpis${icon('list')}</button>
          <button type="button" role="menuitem" data-action="new-period">Nowy okres${icon('flag')}</button>
        </div>
      </div>`;
    }

    /* ---------- Toast ---------- */
    function renderToast() {
      const t = state.toast;
      return `<div class="toast ${t.undo ? 'has-action' : ''} ${t.closing ? 'closing' : ''}" data-key="toast-${t.id}">
        <span>${esc(t.text)}</span>
        ${t.undo ? '<button type="button" class="toast-action" data-action="toast-undo">Cofnij</button>' : ''}
      </div>`;
    }

    /* ============================================================
       Arkusze
       ============================================================ */
    const sheetBtn = (label, action, primary = false, attrs = '') =>
      `<button type="button" class="sheet-btn ${primary ? 'primary' : ''}" data-action="${action}" ${attrs}>${label}</button>`;

    function renderSheet(ctx) {
      const s = state.sheet;
      const builder = SHEETS[s.type];
      const r = builder ? builder(s, ctx) : null;
      if (!r) return '';
      const head = r.alert
        ? ''
        : `<header class="sheet-head" data-drag-handle>
            <span class="grabber" aria-hidden="true"></span>
            ${r.left || '<span></span>'}
            <h2 class="sheet-title" id="sheet-title" tabindex="-1">${r.title}</h2>
            ${r.right || '<span></span>'}
          </header>`;
      return `<div class="sheet-layer ${s.closing ? 'closing' : ''}" data-key="sheet-layer">
        <div class="scrim" data-action="sheet-dismiss" data-keep-style></div>
        <section class="sheet ${r.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-keep-style data-key="sheet">
          ${head}
          <div class="sheet-body">${r.body}</div>
        </section>
      </div>`;
    }

    const SHEETS = {
      habitDetail(s, ctx) {
        const h = findHabit(s.id);
        if (!h) return null;
        const st = habitStats(h, ctx.today, ctx.map, ctx.ws);
        const cal = renderCalendar({
          y: s.y,
          m: s.m,
          ws: ctx.ws,
          nav: 'detail-month',
          cell: (ds, inMonth, col) => {
            const ds2 = habitDayState(h, ds, ctx.today, ctx.map, ctx.ws);
            const band = bandFor(ds, col);
            const sel = ds === s.sel;
            const cls = ['cal-day', `st-${ds2}`, inMonth ? '' : 'outside', sel ? 'sel' : ''].filter(Boolean).join(' ');
            return `<div class="cal-cell ${band.cls}"><button type="button" class="${cls}" data-action="detail-select"
              data-date="${ds}" aria-pressed="${sel}" aria-label="${esc(longDate(ds))}, ${DAY_STATE_LABEL[ds2]}" ${
              ds === ctx.today ? 'aria-current="date"' : ''
            }>${parseDate(ds).getDate()}</button></div>`;
          }
        });

        const selState = habitDayState(h, s.sel, ctx.today, ctx.map, ctx.ws);
        const selDone = selState === 'done';
        const panel = `<div class="day-panel">
          <div>
            <div class="dp-date">${esc(longDate(s.sel))}</div>
            <div class="dp-status">${cap(DAY_STATE_LABEL[selState])}</div>
          </div>
          ${
            selState === 'future'
              ? ''
              : `<button type="button" class="btn btn-sm ${selDone ? 'btn-gray' : 'btn-tinted'}" data-action="detail-toggle">${
                  selDone ? 'Cofnij' : 'Odhacz'
                }</button>`
          }
        </div>`;

        let third;
        if (st.unit === 'week') {
          third = `<div class="stat"><div class="stat-label">Ten tydzień</div><div class="stat-value">${st.thisWeek}/${st.target}</div><div class="stat-sub">${
            st.thisWeek >= st.target ? 'cel osiągnięty' : 'w toku'
          }</div></div>`;
        } else {
          const mr = monthRate(h, s.y, s.m, ctx.today, ctx.map, ctx.ws);
          third = `<div class="stat"><div class="stat-label">${cap(fmtMonth.format(new Date(s.y, s.m, 1, 12)))}</div><div class="stat-value">${
            mr.rate === null ? '—' : `${mr.rate}%`
          }</div><div class="stat-sub">${mr.plan ? `${mr.done} z ${mr.plan}` : 'brak danych'}</div></div>`;
        }
        const unit = st.unit === 'week' ? 'tyg. z rzędu' : 'z rzędu';
        const pause = openPause(h);
        const metaParts = [
          scheduleLabel(h.schedule),
          h.executionTime ? `godz. ${h.executionTime}` : '',
          h.important ? 'ważny' : '',
          h.reminder?.enabled ? `przypomnienie ${h.reminder.time}` : ''
        ].filter(Boolean);

        return {
          title: esc(h.name),
          left: sheetBtn('Zamknij', 'sheet-cancel'),
          right: sheetBtn('Edytuj', 'edit-habit', true, `data-id="${esc(h.id)}"`),
          body: `
            ${
              h.status === 'archived'
                ? '<div class="notice">W archiwum — nie pojawia się na liście Dzisiaj.</div>'
                : h.status === 'paused' && pause
                ? `<div class="notice">Wstrzymany od ${dayMonth(pause.start)}.</div>`
                : ''
            }
            <p class="detail-meta">${esc(metaParts.join(' · '))}${h.note ? `<br>${esc(h.note)}` : ''}</p>
            <div class="stats">
              <div class="stat"><div class="stat-label">Seria</div><div class="stat-value">${st.current}</div><div class="stat-sub">${unit}</div></div>
              <div class="stat"><div class="stat-label">Rekord</div><div class="stat-value">${st.best}</div><div class="stat-sub">${unit}</div></div>
              ${third}
            </div>
            <div class="card">${cal}${panel}</div>`
        };
      },

      habitForm(s) {
        const f = s.form;
        const env = notifEnv();
        let reminderSub = '';
        if (!env.supported) reminderSub = notifStatusText(env);
        else if (env.permission === 'denied') reminderSub = 'Powiadomienia są zablokowane w ustawieniach systemu';
        const showSuggest = !f.isEdit && state.habits.length === 0;
        const dayChips = orderedDays(s.ws ?? 1)
          .map(
            (w) =>
              `<button type="button" class="day-chip" data-action="form-day" data-day="${w.d}" aria-pressed="${f.days.includes(
                w.d
              )}" aria-label="${w.l}">${w.s}</button>`
          )
          .join('');
        const timesChips = [1, 2, 3, 4, 5, 6]
          .map(
            (n) =>
              `<button type="button" class="day-chip" data-action="form-times" data-n="${n}" aria-pressed="${
                Number(f.times) === n
              }" aria-label="${n} ${plural(n, 'raz', 'razy', 'razy')} w tygodniu">${n}×</button>`
          )
          .join('');
        const h = f.isEdit ? findHabit(f.id) : null;

        return {
          title: f.isEdit ? 'Edytuj nawyk' : 'Nowy nawyk',
          left: sheetBtn('Anuluj', 'sheet-cancel'),
          right: sheetBtn(f.isEdit ? 'Zapisz' : 'Dodaj', 'sheet-save', true),
          body: `<form data-form novalidate>
            ${f.error ? `<div class="alert" role="alert">${esc(f.error)}</div>` : ''}
            ${
              showSuggest
                ? `<p class="chips-label">Propozycje</p><div class="chips">${STARTERS.map(
                    (x, i) => `<button type="button" class="chip" data-action="form-suggest" data-i="${i}">${esc(x.name)}</button>`
                  ).join('')}</div>`
                : ''
            }
            <div class="card">
              <div class="field">
                <input class="input" type="text" data-field="name" value="${esc(f.name)}" placeholder="Nazwa, np. 20 minut czytania"
                  aria-label="Nazwa nawyku" autocomplete="off" enterkeyhint="done" maxlength="80" />
              </div>
            </div>
            <div class="card">
              <div class="field-stack">
                <span class="field-label">Częstotliwość</span>
                ${segmented(
                  [
                    ['daily', 'Codziennie'],
                    ['specific_days', 'Wybrane dni'],
                    ['times_per_week', 'Tygodniowo']
                  ],
                  f.scheduleType,
                  'form-schedule',
                  'Częstotliwość'
                )}
                ${f.scheduleType === 'specific_days' ? `<div class="days" role="group" aria-label="Dni tygodnia">${dayChips}</div>` : ''}
                ${
                  f.scheduleType === 'times_per_week'
                    ? `<span class="field-label">Ile razy w tygodniu</span><div class="times" role="group" aria-label="Ile razy w tygodniu">${timesChips}</div>`
                    : ''
                }
              </div>
            </div>
            <ul class="card list">
              <li class="row">
                <label class="row-text" for="f-time"><span class="row-title">Godzina</span></label>
                ${
                  f.time
                    ? `<button type="button" class="icon-btn sm" data-action="form-clear-time" aria-label="Usuń godzinę">${icon('close')}</button>`
                    : ''
                }
                <input id="f-time" class="input-time" type="time" data-field="time" data-rerender value="${esc(f.time)}" />
              </li>
              ${switchRow('Ważny', 'Na początku listy', f.important, 'form-toggle', 'important')}
              ${switchRow('Przypomnienie', esc(reminderSub), f.reminder, 'form-reminder', 'reminder')}
              ${
                f.reminder
                  ? `<li class="row">
                      <label class="row-text" for="f-rtime"><span class="row-title">Godzina przypomnienia</span></label>
                      <input id="f-rtime" class="input-time" type="time" data-field="reminderTime" value="${esc(f.reminderTime)}" />
                    </li>`
                  : ''
              }
            </ul>
            <div class="card">
              <div class="field">
                <input class="input" type="text" data-field="note" value="${esc(f.note)}" placeholder="Notatka (opcjonalnie)"
                  aria-label="Notatka" maxlength="120" enterkeyhint="done" />
              </div>
            </div>
            ${
              h
                ? `<ul class="card list">
                    ${
                      h.status !== 'archived'
                        ? actionRow(h.status === 'paused' ? 'Wznów' : 'Wstrzymaj', 'habit-pause', {
                            sub: h.status === 'paused' ? '' : 'Wstrzymane dni nie liczą się do serii'
                          })
                        : ''
                    }
                    ${actionRow(h.status === 'archived' ? 'Przywróć z archiwum' : 'Przenieś do archiwum', 'habit-archive', {
                      sub: h.status === 'archived' ? '' : 'Znika z listy Dzisiaj, historia zostaje'
                    })}
                    ${actionRow('Usuń nawyk', 'habit-delete', { tone: 'danger', sub: 'Razem z całą historią' })}
                  </ul>`
                : ''
            }
            <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Zapisz</button>
          </form>`
        };
      },

      entryForm(s) {
        const f = s.form;
        const active = state.habits.filter((h) => h.status === 'active' || h.id === f.linked);
        const part = f.hasTime && f.time ? partOfDay(f.time) : f.part;
        return {
          title: f.isEdit ? 'Edytuj wpis' : 'Nowy wpis',
          left: sheetBtn('Anuluj', 'sheet-cancel'),
          right: sheetBtn(f.isEdit ? 'Zapisz' : 'Dodaj', 'sheet-save', true),
          body: `<form data-form novalidate>
            <p class="sheet-sub">${esc(longDate(f.date))}</p>
            ${f.error ? `<div class="alert" role="alert">${esc(f.error)}</div>` : ''}
            <div class="card">
              <div class="field">
                <input class="input" type="text" data-field="content" value="${esc(f.content)}" placeholder="Co chcesz zrobić?"
                  aria-label="Treść wpisu" autocomplete="off" enterkeyhint="done" maxlength="120" />
              </div>
              <div class="field">
                <input class="input" type="text" data-field="description" value="${esc(f.description)}" placeholder="Szczegóły (opcjonalnie)"
                  aria-label="Szczegóły" maxlength="200" enterkeyhint="done" />
              </div>
            </div>
            <ul class="card list">
              <li><div class="field-stack">
                <span class="field-label">Pora dnia</span>
                ${segmented(PARTS, part, 'form-part', 'Pora dnia', f.hasTime)}
              </div></li>
              ${switchRow('Konkretna godzina', '', f.hasTime, 'form-toggle', 'hasTime')}
              ${
                f.hasTime
                  ? `<li class="row">
                      <label class="row-text" for="f-etime"><span class="row-title">Godzina</span></label>
                      <input id="f-etime" class="input-time" type="time" data-field="time" data-rerender value="${esc(f.time)}" />
                    </li>`
                  : ''
              }
            </ul>
            ${
              active.length
                ? `<ul class="card list" style="margin-bottom:0">
                    <li class="row">
                      <label class="row-text" for="f-link"><span class="row-title">Nawyk</span></label>
                      <select id="f-link" class="select" data-field="linked" data-rerender>
                        <option value="" ${!f.linked ? 'selected' : ''}>Brak</option>
                        ${active
                          .map(
                            (h) =>
                              `<option value="${esc(h.id)}" ${f.linked === h.id ? 'selected' : ''}>${esc(h.name)}</option>`
                          )
                          .join('')}
                      </select>
                    </li>
                  </ul>
                  <p class="group-note" style="margin-bottom:1.25rem">${
                    f.linked ? 'Odhaczenie wpisu odhaczy też ten nawyk.' : 'Powiąż wpis z nawykiem, aby odhaczać oba naraz.'
                  }</p>`
                : ''
            }
            ${f.isEdit ? `<ul class="card list">${actionRow('Usuń wpis', 'entry-delete-form', { tone: 'danger' })}</ul>` : ''}
            <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Zapisz</button>
          </form>`
        };
      },

    const STARTERS = [

    /* ============================================================
       Arkusze — otwieranie, zamykanie, przeciąganie
       ============================================================ */
    let lastOpener = null;
    function openSheet(type, data = {}) {
      if (!state.sheet && !lastOpener) lastOpener = document.activeElement;
      state.menu = null;
      state.sheet = { type, ...data, closing: false, focusPending: true };
      render();
    }
    function restoreFocus() {
      if (lastOpener && lastOpener.isConnected) lastOpener.focus({ preventScroll: true });
      lastOpener = null;
    }
    function closeSheet(immediate = false) {
      const s = state.sheet;
      if (!s || s.closing) return;
      if (immediate) {
        state.sheet = null;
        render();
        restoreFocus();
        return;
      }
      s.closing = true;
      render();
      const wide = window.matchMedia('(min-width: 44rem)').matches;
      setTimeout(
        () => {
          if (state.sheet === s) {
            state.sheet = null;
            render();
            restoreFocus();
          }
        },
        reduceMotion.matches ? 170 : wide ? 190 : 290
      );
    }
    const sheetIsDirty = () => Boolean(state.sheet && state.sheet.form && state.sheet.form.dirty);

    let drag = null;
    const rubber = (x) => (x * 0.55 * 300) / (300 + 0.55 * x);
    document.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('[data-drag-handle]');
      if (!handle || e.target.closest('button') || window.matchMedia('(min-width: 44rem)').matches) return;
      const sheet = handle.closest('.sheet');
      const scrim = sheet.parentElement.querySelector('.scrim');
      drag = { sheet, scrim, id: e.pointerId, startY: e.clientY, y: 0, pts: [{ y: e.clientY, t: e.timeStamp }] };
      handle.setPointerCapture(e.pointerId);
      sheet.style.transition = 'none';
      scrim.style.transition = 'none';
    });
    document.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      let dy = e.clientY - drag.startY;
      if (dy < 0) dy = -rubber(-dy);
      drag.y = dy;
      drag.sheet.style.transform = `translateY(${dy}px)`;
      const h = drag.sheet.offsetHeight || 1;
      drag.scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / h));
      drag.pts.push({ y: e.clientY, t: e.timeStamp });
      if (drag.pts.length > 6) drag.pts.shift();
    });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const { sheet, scrim, pts, y } = drag;
      drag = null;
      const a = pts[0];
      const b = pts[pts.length - 1];
      const v = b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0; // px/ms
      const h = sheet.offsetHeight || 1;
      const shouldClose = !sheetIsDirty() && (y > h * 0.3 || (v > 0.5 && y > 8));
      if (shouldClose) {
        const remaining = h - y;
        const dur = Math.max(140, Math.min(320, remaining / Math.max(v, 1.2)));
        sheet.style.transition = `transform ${dur}ms cubic-bezier(0.2, 0.8, 0.3, 1)`;
        sheet.style.transform = 'translateY(100%)';
        scrim.style.transition = `opacity ${dur}ms ease`;
        scrim.style.opacity = '0';
        setTimeout(() => closeSheet(true), dur);
      } else {
        sheet.style.transition = 'transform 420ms var(--ease-drawer)';
        sheet.style.transform = 'translateY(0)';
        scrim.style.transition = 'opacity 300ms ease';
        scrim.style.opacity = '1';
        setTimeout(() => {
          if (!sheet.isConnected) return;
          sheet.style.removeProperty('transform');
          sheet.style.removeProperty('transition');
          scrim.style.removeProperty('opacity');
          scrim.style.removeProperty('transition');
        }, 440);
      }
    }
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    /* ============================================================
       Toast z „Cofnij”
       ============================================================ */
    let toastTimer = null;
    function toast(text, undo = null) {
      state.toast = { id: Date.now(), text, undo, closing: false };
      render();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(dismissToast, undo ? 5000 : 2600);
    }
    function dismissToast() {
      const t = state.toast;
      if (!t || t.closing) return;
      t.closing = true;
      render();
      setTimeout(() => {
        if (state.toast === t) {
          state.toast = null;
          render();
        }

    async function setCompletion(habitId, date, completed) {
      const rec = { id: `${habitId}_${date}`, habitId, date, completed: Boolean(completed), updatedAt: Date.now() };
      const i = state.completions.findIndex((c) => c.id === rec.id);
      if (i >= 0) state.completions[i] = rec;
      else state.completions.push(rec);
      await persist(dbPut('completions', rec));
    }
    async function toggleCompletion(habitId, date) {
      const map = buildMap(state.completions);
      const next = !isDone(habitId, date, map);
      const p = setCompletion(habitId, date, next);
      render();
      await p;
      checkReminders();
    }

    async function saveHabitRecord(rec) {
      const i = state.habits.findIndex((h) => h.id === rec.id);
      if (i >= 0) state.habits[i] = rec;
      else state.habits.push(rec);
      await persist(dbPut('habits', rec));
    }

    async function deleteHabit(id) {
      const habit = findHabit(id);
      if (!habit) return;
      const comps = state.completions.filter((c) => c.habitId === id);
      const linked = state.entries.filter((e) => e.linkedHabitId === id);
      state.habits = state.habits.filter((h) => h.id !== id);
      state.completions = state.completions.filter((c) => c.habitId !== id);
      const unlinked = linked.map((e) => {
        const copy = { ...e, updatedAt: Date.now() };
        delete copy.linkedHabitId;
        return copy;
      });
      state.entries = state.entries.map((e) => unlinked.find((u) => u.id === e.id) || e);
      persist(
        dbTx(['habits', 'completions', 'planner_entries'], (t) => {
          t.objectStore('habits').delete(id);
          comps.forEach((c) => t.objectStore('completions').delete(c.id));
          unlinked.forEach((e) => t.objectStore('planner_entries').put(e));
        })
      );
      closeSheet();
      toast('Usunięto nawyk', async () => {
        state.habits.push(habit);
        state.completions.push(...comps);
        state.entries = state.entries.map((e) => linked.find((l) => l.id === e.id) || e);
        await persist(
          dbTx(['habits', 'completions', 'planner_entries'], (t) => {
            t.objectStore('habits').put(habit);
            comps.forEach((c) => t.objectStore('completions').put(c));
            linked.forEach((e) => t.objectStore('planner_entries').put(e));
          })
        );
        render();
      });
    }
