                                </div>
                                <div class="row-subtitle" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                  ${timeStr ? `<span>🕒 ${escapeHtml(timeStr)}</span>` : ''}
                                  ${habit.note ? `<span>${escapeHtml(habit.note)}</span>` : ''}
                                  ${
                                    alert
                                      ? `<span style="color:var(--ios-red); font-weight:700;">● Nie przerywaj rytmu</span>`
                                      : ''
                                  }
                                </div>
                              </button>

                              <button
                                type="button"
                                data-action="open-habit-detail"
                                data-habit-id="${escapeHtml(habit.id)}"
                                aria-label="Szczegóły nawyku"
                                style="color:var(--text-muted); font-size:18px; padding:4px 6px;"
                              >›</button>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>
                  </section>`
                : ''
            }

            <!-- POZA DZISIEJSZYM HARMONOGRAMEM -->
            ${
              state.settings.showUnscheduledToday !== false && unscheduledHabits.length > 0
                ? `<section class="ios-section">
                    <div class="ios-section-title">
                      <span>Poza dzisiejszym harmonogramem (${unscheduledHabits.length})</span>
                    </div>
                    <div class="ios-card">
                      ${unscheduledHabits
                        .map(
                          (h) => `
                        <button
                          type="button"
                          data-action="open-habit-detail"
                          data-habit-id="${escapeHtml(h.id)}"
                          class="ios-row"
                          style="width:100%; text-align:left;"
                        >
                          <div class="row-info">
                            <div class="row-title" style="color:var(--text-secondary);">${escapeHtml(h.name)}</div>
                            <div class="row-subtitle">${escapeHtml(formatScheduleLabel(h.schedule))}</div>
                          </div>
                          <span style="color:var(--text-muted); font-size:18px;">›</span>
                        </button>
                      `
                        )
                        .join('')}
                    </div>
                  </section>`
                : ''
            }
          `
          }
        </div>
      `;
    }

    function renderOverallHistoryView(completionMap) {
      const todayStr = state.todayStr;
      const weekStartsOn = state.settings.weekStartsOn;
      const orderedDays = getOrderedWeekDays(weekStartsOn);

      const endWeekStart = getStartOfWeek(todayStr, weekStartsOn);
      const weeks = [];
      const firstWeekStart = addDays(endWeekStart, -51 * 7);
      for (let w = 0; w < 52; w++) {
        const wStart = addDays(firstWeekStart, w * 7);
        const col = [];
        for (let d = 0; d < 7; d++) {
          const dStr = addDays(wStart, d);
          col.push(getDailyAggregateSummary(dStr, todayStr, state.habits, completionMap, weekStartsOn));
        }
        weeks.push(col);
      }

      const monthCells = getCalendarGridDays(
        state.historyMonthYear.year,
        state.historyMonthYear.month,
        weekStartsOn
      ).map((c) => ({
        ...c,
        summary: getDailyAggregateSummary(c.dateStr, todayStr, state.habits, completionMap, weekStartsOn)
      }));

      const selectedSum = getDailyAggregateSummary(
        state.historySelectedDate,
        todayStr,
        state.habits,
        completionMap,
        weekStartsOn
      );

      const getYearCellClass = (s) => {
        if (s.isFuture) return 'year-cell future';
        if (s.scheduledCount === 0 || s.completionRatio === null || s.completionRatio === 0) return 'year-cell lvl-0';
        if (s.completionRatio < 0.45) return 'year-cell lvl-1';
        if (s.completionRatio < 0.85) return 'year-cell lvl-2';
        return 'year-cell lvl-3';
      };

      return `
        <div>
          ${
            state.historyMode === 'year'
              ? `
            <section class="ios-card-padded">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:13px; font-weight:700;">Ostatnie 52 tygodnie</span>
                <span style="font-size:11px; color:var(--text-secondary);">Dotknij kratki, aby sprawdzić dzień</span>
              </div>
              <div class="year-grid-scroll">
                <div class="year-grid-weeks">
                  ${weeks
                    .map(
                      (col) => `
                    <div class="year-grid-col">
                      ${col
                        .map((daySum) => {
                          const ring = daySum.isToday
                            ? 'today-ring'
                            : daySum.dateStr === state.historySelectedDate
                            ? 'selected-ring'
                            : '';
                          return `<button
                            type="button"
                            data-action="select-history-date"
                            data-date="${daySum.dateStr}"
                            title="${daySum.dateStr}"
                            class="${getYearCellClass(daySum)} ${ring}"
                          ></button>`;
                        })
                        .join('')}
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:11px; color:var(--text-secondary);">
                <span>Dni bez planu są neutralne</span>
                <div style="display:flex; align-items:center; gap:4px;">
                  <span>0%</span>
                  <span class="year-cell lvl-0" style="display:inline-block;"></span>
                  <span class="year-cell lvl-1" style="display:inline-block;"></span>
                  <span class="year-cell lvl-2" style="display:inline-block;"></span>
                  <span class="year-cell lvl-3" style="display:inline-block;"></span>
                  <span>100%</span>
                </div>
              </div>
            </section>
          `
              : `
            <section class="ios-card-padded">
              <div class="calendar-header">
                <button type="button" data-action="history-prev-month" class="calendar-nav-btn">‹</button>
                <span style="font-size:15px; font-weight:700;">
                  ${escapeHtml(formatPolishMonthYear(state.historyMonthYear.year, state.historyMonthYear.month))}
                </span>
                <button type="button" data-action="history-next-month" class="calendar-nav-btn">›</button>
              </div>
              <div class="calendar-grid">
                ${orderedDays.map((d) => `<div class="calendar-dow">${d.label}</div>`).join('')}
                ${monthCells
                  .map(({ dateStr, inCurrentMonth, summary }) => {
                    const dayNum = Number(dateStr.split('-')[2]);
                    const ribbon = getPeriodRibbonInfo(dateStr);
                    const isSelected = dateStr === state.historySelectedDate;
                    let dayBtnClass = 'cal-day-btn';
                    if (!inCurrentMonth) dayBtnClass += ' outside';
                    if (summary.completionRatio && summary.completionRatio >= 0.85) dayBtnClass += ' habit-done';
                    if (summary.isToday) dayBtnClass += ' today';
                    if (isSelected) dayBtnClass += ' selected';

                    return `
                      <div class="cal-cell-wrap ${ribbon ? `${ribbon.meta.bgClass} ${ribbon.shapeClass}` : ''}">
                        ${ribbon ? `<span class="cal-period-top-bar ${ribbon.meta.barClass}"></span>` : ''}
                        <button type="button" data-action="select-history-date" data-date="${dateStr}" class="${dayBtnClass}">
                          <span>${dayNum}</span>
                        </button>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
              ${renderMonthPeriodsChips(state.historyMonthYear.year, state.historyMonthYear.month)}
            </section>
          `
          }

          <section class="ios-card-padded">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <div>
                <div style="font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-secondary);">
                  Podsumowanie dnia ${selectedSum.isToday ? '(Dzisiaj)' : ''}
                </div>
                <div style="font-size:15px; font-weight:700;">${escapeHtml(formatPolishFullDate(selectedSum.dateStr))}</div>
              </div>
              ${
                !selectedSum.isFuture && selectedSum.scheduledCount > 0
                  ? `<span class="pill pill-blue">${selectedSum.completedCount}/${selectedSum.scheduledCount} (${Math.round((selectedSum.completionRatio || 0) * 100)}%)</span>`
                  : ''
              }
            </div>

            ${renderPeriodBannersForDate(selectedSum.dateStr)}

            ${
              selectedSum.isFuture
                ? `<p style="font-size:13px; color:var(--text-secondary);">Dzień z przyszłości — przyszłe dni nie są oceniane.</p>`
                : selectedSum.scheduledCount === 0
                ? `<p style="font-size:13px; color:var(--text-secondary);">Brak zaplanowanych nawyków w tym dniu (dzień neutralny).</p>`
                : `<div>
                    ${selectedSum.scheduledHabits
                      .map(
                        ({ habit, completed }) => `
                      <div class="ios-row" style="padding:10px 0;">
                        <button type="button" data-action="open-habit-detail" data-habit-id="${escapeHtml(habit.id)}" style="font-weight:600; text-align:left;">
                          ${escapeHtml(habit.name)}
                        </button>
                        <span class="pill ${completed ? 'pill-green' : selectedSum.isToday ? 'pill-blue' : 'pill-neutral'}">
                          ${completed ? 'Wykonany' : selectedSum.isToday ? 'W trakcie' : 'Pominięty'}
                        </span>
                      </div>
                    `
                      )
                      .join('')}
                  </div>`
            }
          </section>
        </div>
      `;
    }

    function renderPlannerView(completionMap) {
      const todayStr = state.todayStr;
      const selDate = state.plannerSelectedDate;
      const weekStartsOn = state.settings.weekStartsOn;
      const orderedDays = getOrderedWeekDays(weekStartsOn);

      const byDate = new Map();
      for (const e of state.plannerEntries) {
        const list = byDate.get(e.date) || [];
        list.push(e);
        byDate.set(e.date, list);
      }

      const rawDayEntries = [...(byDate.get(selDate) || [])];
      const dayEntries =
        state.plannerMode === 'time'
          ? rawDayEntries.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99') || (a.order || 0) - (b.order || 0))
          : rawDayEntries.sort((a, b) => (a.order || 0) - (b.order || 0));

      const cells = getCalendarGridDays(
        state.plannerMonthYear.year,
        state.plannerMonthYear.month,
        weekStartsOn
      );

      const activeHabits = state.habits.filter((h) => h.status === 'active');
      const periodsMeta = [
        { id: 'morning', label: '🌅 Rano' },
        { id: 'afternoon', label: '☀️ Popołudnie' },
        { id: 'evening', label: '🌙 Wieczór' }

                ${escapeHtml(formatPolishMonthYear(state.plannerMonthYear.year, state.plannerMonthYear.month))}

                .map(({ dateStr, inCurrentMonth }) => {
                  const dayNum = Number(dateStr.split('-')[2]);
                  const isSelected = dateStr === selDate;
                  const isToday = dateStr === todayStr;
                  const hasPlan = (byDate.get(dateStr)?.length || 0) > 0;
                  const sum = getDailyAggregateSummary(dateStr, todayStr, state.habits, completionMap, weekStartsOn);
                  const allHabitsDone =
                    !sum.isFuture && sum.scheduledCount > 0 && sum.completedCount === sum.scheduledCount;
                  const ribbon = getPeriodRibbonInfo(dateStr);

                  let btnClass = 'cal-day-btn';
                  if (!inCurrentMonth) btnClass += ' outside';
                  if (isToday) btnClass += ' today';
                  if (isSelected) btnClass += ' selected';

                  return `
                    <div class="cal-cell-wrap ${ribbon ? `${ribbon.meta.bgClass} ${ribbon.shapeClass}` : ''}">
                      ${ribbon ? `<span class="cal-period-top-bar ${ribbon.meta.barClass}" title="${escapeHtml(ribbon.period.name)}"></span>` : ''}
                      <button
                        type="button"
                        data-action="planner-select-date"
                        data-date="${dateStr}"
                        title="${ribbon ? `${dateStr} • ${escapeHtml(ribbon.period.name)}` : dateStr}"
                        class="${btnClass}"
                      >
                        <span>${dayNum}</span>
                        <div class="cal-dots">
                          ${hasPlan ? `<span class="dot-planner"></span>` : ''}
                          ${allHabitsDone ? `<span class="dot-habits-done"></span>` : ''}

                    </div>
                  `;

            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:10px; font-size:11px; color:var(--text-secondary);">

                <span class="dot-planner"></span> Wpis planera

              <span style="display:inline-flex; align-items:center; gap:5px;">
                <span class="dot-habits-done"></span> Wykonane nawyki
              </span>
              <span style="display:inline-flex; align-items:center; gap:5px;">
                <span style="width:12px; height:4px; border-radius:99px; background:#F59E0B; display:inline-block;"></span> Oznaczony okres (np. wyjazd)
              </span>
            </div>

            ${renderMonthPeriodsChips(state.plannerMonthYear.year, state.plannerMonthYear.month)}
          </section>

          ${renderPeriodBannersForDate(selDate)}

          <!-- PRZEŁĄCZNIK TRYBU PLANOWANIA DNIA -->
          <section class="ios-section">
            <div class="ios-section-title">
              <span>Plan dnia: ${escapeHtml(formatPolishFullDate(selDate))}</span>
            </div>

            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
              <div class="ios-segmented cols-2" style="flex:1;">
                <button
                  type="button"
                  data-action="set-planner-mode"
                  data-mode="period"
                  class="ios-segment-btn ${state.plannerMode === 'period' ? 'active' : ''}"
                >
                  Pory dnia
                </button>
                <button
                  type="button"
                  data-action="set-planner-mode"
                  data-mode="time"
                  class="ios-segment-btn ${state.plannerMode === 'time' ? 'active' : ''}"
                >
                  Godzinowy
                </button>
              </div>
              <button type="button" data-action="open-planner-form" class="btn btn-primary" style="padding:9px 14px;">
                + Dodaj wpis
              </button>
            </div>

            <!-- FORMULARZ WPISU PLANERA -->
            ${
              state.plannerFormOpen && state.plannerForm
                ? `
              <form id="planner-entry-form" class="ios-card-padded" style="border-color:var(--ios-blue);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                  <span style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--ios-blue);">
                    ${state.plannerForm.isEdit ? 'Edytuj wpis w planie' : 'Nowy wpis w planie dnia'}
                  </span>
                  <button type="button" data-action="close-planner-form" style="font-size:12px; color:var(--text-secondary);">Zamknij ×</button>
                </div>

                <div style="display:flex; flex-direction:column; gap:10px;">
                  <input
                    type="text"
                    id="pf-content"
                    required
                    placeholder="Co planujesz zrobić?"
                    value="${escapeHtml(state.plannerForm.content)}"
                    style="width:100%;"
                  />
                  <input
                    type="text"
                    id="pf-description"
                    placeholder="Opcjonalny opis lub szczegóły..."
                    value="${escapeHtml(state.plannerForm.description)}"
                    style="width:100%;"
                  />

                  ${
                    state.plannerMode === 'period'
                      ? `<div class="ios-segmented cols-3">
                          ${periodsMeta
                            .map(
                              (p) => `
                            <button
                              type="button"
                              data-action="pf-set-period"
                              data-period="${p.id}"
                              class="ios-segment-btn ${state.plannerForm.timeOfDay === p.id ? 'active' : ''}"
                            >${p.label}</button>
                          `
                            )
                            .join('')}
                        </div>`
                      : `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
                          <label for="pf-time" style="font-size:13px; font-weight:600;">Godzina wykonania:</label>
                          <input id="pf-time" type="time" value="${escapeHtml(state.plannerForm.time)}" />
                        </div>`
                  }

                  ${
                    activeHabits.length > 0
                      ? `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
                          <label for="pf-linked-habit" style="font-size:12px; color:var(--text-secondary);">Powiąż z nawykiem (opcjonalnie):</label>
                          <select id="pf-linked-habit" style="max-width:200px;">
                            <option value="">Brak powiązania</option>
                            ${activeHabits
                              .map(
                                (h) => `
                              <option value="${escapeHtml(h.id)}" ${state.plannerForm.linkedHabitId === h.id ? 'selected' : ''}>
                                ${escapeHtml(h.name)}
                              </option>
                            `
                              )
                              .join('')}
                          </select>
                        </div>`
                      : ''
                  }

                  <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
                    <button type="button" data-action="close-planner-form" class="btn btn-secondary">Anuluj</button>
                    <button type="submit" class="btn btn-primary">Zapisz wpis</button>
                  </div>
                </div>
              </form>
            `
                : ''
            }

            <!-- LISTA WPISÓW PLANERA -->
            ${
              dayEntries.length === 0
                ? `
              <div class="ios-card-padded" style="text-align:center; padding:28px 16px;">
                <p style="font-size:15px; font-weight:700; margin-bottom:4px;">Brak wpisów w planie na ten dzień</p>
                <p style="font-size:12px; color:var(--text-secondary); max-width:290px; margin:0 auto 14px auto;">
                  Zaplanuj zadania według pór dnia (Rano, Popołudnie, Wieczór) lub konkretnych godzin.

                <button type="button" data-action="open-planner-form" class="btn btn-secondary" style="color:var(--ios-blue);">
                  + Zaplanuj ten dzień
                </button>
              </div>
            `
                : state.plannerMode === 'period'
                ? periodsMeta
                    .map((per) => {
                      const items = dayEntries.filter((e) => (e.timeOfDay || 'morning') === per.id);
                      return `
                        <div class="ios-card">
                          <div class="ios-row" style="background:var(--bg-subtle); padding:10px 16px;">
                            <span style="font-size:13px; font-weight:700;">${per.label} (${items.length})</span>
                            <button
                              type="button"
                              data-action="open-planner-form-period"
                              data-period="${per.id}"
                              style="font-size:12px; font-weight:700; color:var(--ios-blue);"
                            >+ Dodaj</button>
                          </div>
                          ${
                            items.length === 0
                              ? `<div class="ios-row"><span style="font-size:12px; color:var(--text-muted);">Brak wpisów na tę porę dnia.</span></div>`
                              : items
                                  .map((entry, idx) => {

                                    return `
                                      <div class="ios-row">
                                        <button

                                          data-action="toggle-planner-done"

                                          style="width:24px; height:24px; border-radius:7px;"
                                        >✓</button>
                                        <div class="row-info">
                                          <div class="row-title" style="${entry.done ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">
                                            ${escapeHtml(entry.content)}
                                          </div>
                                          ${entry.description ? `<div class="row-subtitle">${escapeHtml(entry.description)}</div>` : ''}
                                          ${linked ? `<div style="margin-top:4px;"><span class="pill pill-blue">Nawyk: ${escapeHtml(linked.name)}</span></div>` : ''}
                                        </div>
                                        <div class="row-actions">
                                          <button type="button" ${idx === 0 ? 'disabled' : ''} data-action="move-planner-entry" data-entry-id="${escapeHtml(entry.id)}" data-dir="-1" style="padding:4px;">↑</button>
                                          <button type="button" ${idx === items.length - 1 ? 'disabled' : ''} data-action="move-planner-entry" data-entry-id="${escapeHtml(entry.id)}" data-dir="1" style="padding:4px;">↓</button>

                                          <button type="button" data-action="delete-planner-entry" data-entry-id="${escapeHtml(entry.id)}" class="btn-icon-x" style="width:28px; height:28px;">×</button>

                                      </div>
                                    `;
                                  })
                                  .join('')
                          }
                        </div>
                      `;
                    })
                    .join('')
                : `
              <div class="ios-card">
                ${dayEntries
                  .map((entry) => {
                    const linked = state.habits.find((h) => h.id === entry.linkedHabitId);
                    return `
                      <div class="ios-row">
                        <button
                          type="button"
                          data-action="toggle-planner-done"
                          data-entry-id="${escapeHtml(entry.id)}"
                          class="habit-check-btn ${entry.done ? 'completed' : ''}"
                          style="width:24px; height:24px; border-radius:7px;"
                        >✓</button>
                        <span class="pill pill-blue" style="font-size:12px;">${escapeHtml(entry.time || '--:--')}</span>
                        <div class="row-info">
                          <div class="row-title" style="${entry.done ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">
                            ${escapeHtml(entry.content)}
                          </div>
                          ${entry.description ? `<div class="row-subtitle">${escapeHtml(entry.description)}</div>` : ''}
                          ${linked ? `<div style="margin-top:4px;"><span class="pill pill-neutral">Nawyk: ${escapeHtml(linked.name)}</span></div>` : ''}
                        </div>
                        <div class="row-actions">
                          <button type="button" data-action="edit-planner-entry" data-entry-id="${escapeHtml(entry.id)}" class="btn btn-secondary" style="padding:5px 9px; font-size:11px;">Edytuj</button>
                          <button type="button" data-action="delete-planner-entry" data-entry-id="${escapeHtml(entry.id)}" class="btn-icon-x" style="width:28px; height:28px;">×</button>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            `
            }
          </section>
        </div>
      `;
    }

                <div class="row-info">

                  <div class="row-subtitle">Szybkie przełączenie widoku jasny / ciemny</div>
                </div>
                <button

            </div>

              <div class="ios-row">

                  <div class="row-subtitle">Stan uprawnień: <strong>${escapeHtml(permLabel)}</strong></div>

              </div>

          <!-- 6. EKSPORT DANYCH, CSV, KOPIA ZAPASOWA I CZYSZCZENIE BAZY -->

              <span>6. Eksport danych, CSV i kopia zapasowa</span>
            </div>

              <div class="ios-row-stack">
                <div class="row-title">Kopia zapasowa całej aplikacji (JSON)</div>

                  <div style="padding:12px; border-radius:12px; background:var(--ios-amber-soft); border:1px solid var(--ios-amber);">
                    <div style="font-size:13px; font-weight:700; margin-bottom:4px;">Potwierdź odtworzenie kopii JSON</div>
                    <div style="font-size:12px; margin-bottom:10px;">
                      Plik zawiera: <strong>${state.pendingBackupImport.habits.length}</strong> nawyków,
                      <strong>${state.pendingBackupImport.completions.length}</strong> wykonań oraz
                      <strong>${(state.pendingBackupImport.periods || []).length}</strong> okresów.
                    </div>
                    <div style="display:flex; gap:8px;">
                      <button type="button" data-action="cancel-import-json" class="btn btn-secondary" style="flex:1;">Anuluj</button>
                      <button type="button" data-action="confirm-import-json" class="btn btn-primary" style="flex:1;">Zastąp i odtwórz</button>

                  </div>

              <div class="ios-row-stack">
                <div class="row-title">Eksport tabel do arkusza CSV (Excel / Numbers)</div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                  <button type="button" data-action="export-csv-habits" class="btn btn-secondary">📊 CSV: Nawyki i historia</button>
                  <button type="button" data-action="export-csv-planner" class="btn btn-secondary">📅 CSV: Planer i okresy</button>

              <div class="ios-row-stack">

                      </button>`
                    : `<div style="padding:12px; border-radius:12px; background:var(--ios-red-soft); border:1px solid var(--ios-red);">
                        <div style="font-size:13px; font-weight:700; color:var(--ios-red); margin-bottom:8px;">
                          Czy na pewno chcesz bezpowrotnie wyczyścić całą bazę danych?

                        <div style="display:flex; gap:8px;">
                          <button type="button" data-action="cancel-clear-all-data" class="btn btn-secondary" style="flex:1;">Anuluj</button>

          <!-- 7. DIAGNOSTYKA I TESTY JEDNOSTKOWE -->

                <div class="row-info">
                  <div class="row-title">Weryfikacja silnika aplikacji</div>

                </div>
                <div class="row-actions">
                  <button type="button" data-action="run-unit-tests" class="btn btn-primary" style="padding:7px 12px; font-size:12px;">

                    state.unitTestResults
                      ? `<button type="button" data-action="hide-unit-tests" class="btn btn-secondary" style="padding:7px 11px; font-size:12px;">

                        </button>`
                      : ''
                  }

              </div>

              ${
                state.unitTestResults
                  ? `<div class="ios-row-stack">
                      <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:12px; font-weight:700; color:var(--ios-green);">

                        </span>
                        <button type="button" data-action="hide-unit-tests" style="font-size:12px; font-weight:600; color:var(--ios-blue);">

                        </button>

                      <div style="display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;">

                          .map(

                          <div style="font-size:12px; display:flex; align-items:center; gap:6px;">
                            <span style="color:${r.passed ? 'var(--ios-green)' : 'var(--ios-red)'}; font-weight:700;">
                              ${r.passed ? '✓' : '✗'}
                            </span>
                            <span>${escapeHtml(r.name)}</span>
                          </div>
                        `
                          )
                          .join('')}
                      </div>
                    </div>`
                  : ''
              }
            </div>
          </section>
        </div>
      `;

    function renderHabitModal() {
      if (!state.habitModalOpen || !state.habitForm) return '';
      const f = state.habitForm;
      const isFirst = state.habits.length === 0 && !f.isEdit;

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-sheet">
            <div class="modal-topbar">
              <button type="button" data-action="close-habit-modal" style="font-size:14px; color:var(--text-secondary);">Anuluj</button>
              <span style="font-size:16px; font-weight:700;">${f.isEdit ? 'Edytuj nawyk' : 'Nowy nawyk'}</span>
              <button type="button" data-action="save-habit-modal" style="font-size:14px; font-weight:700; color:var(--ios-blue);">Zapisz</button>
            </div>

            <div class="modal-body">
              ${
                f.error
                  ? `<div style="padding:10px 12px; border-radius:12px; background:var(--ios-red-soft); color:var(--ios-red); font-size:12px; font-weight:600; margin-bottom:12px;">
                      ${escapeHtml(f.error)}
                    </div>`
                  : ''
              }

              ${
                isFirst
                  ? `<div style="margin-bottom:14px;">
                      <div style="font-size:11px; font-weight:600; color:var(--text-secondary); margin-bottom:6px;">
                        Szybkie propozycje na start (dotknij, aby wypełnić):
                      </div>
                      <div style="display:flex; flex-wrap:wrap; gap:6px;">
                        ${STARTER_SUGGESTIONS.map(
                          (s, i) => `
                          <button type="button" data-action="apply-habit-suggestion" data-index="${i}" class="pill pill-blue" style="padding:6px 10px; font-size:12px;">
                            + ${escapeHtml(s.name)}
                          </button>
                        `
                        ).join('')}
                      </div>
                    </div>`
                  : ''
              }

              <div class="ios-card">
                <div class="ios-row-stack">
                  <label for="hm-name" style="font-size:12px; font-weight:600; color:var(--text-secondary);">NAZWA NAWYKU *</label>
                  <input id="hm-name" type="text" placeholder="np. 20 minut czytania, Trening..." value="${escapeHtml(f.name)}" style="width:100%;" />
                </div>

                <div class="ios-row-stack">
                  <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">CZĘSTOTLIWOŚĆ *</span>
                  <div class="ios-segmented cols-3">
                    <button type="button" data-action="hm-set-schedule" data-type="daily" class="ios-segment-btn ${f.scheduleType === 'daily' ? 'active' : ''}">Codziennie</button>
                    <button type="button" data-action="hm-set-schedule" data-type="specific_days" class="ios-segment-btn ${f.scheduleType === 'specific_days' ? 'active' : ''}">Wybrane dni</button>
                    <button type="button" data-action="hm-set-schedule" data-type="times_per_week" class="ios-segment-btn ${f.scheduleType === 'times_per_week' ? 'active' : ''}">X w tygodniu</button>
                  </div>

                  ${
                    f.scheduleType === 'specific_days'
                      ? `<div class="days-7-grid" style="margin-top:6px;">
                          ${DAY_LABELS_MON_FIRST.map(({ day, label }) => {
                            const sel = f.daysOfWeek.includes(day);
                            return `<button type="button" data-action="hm-toggle-day" data-day="${day}" class="day-pill-btn ${sel ? 'selected' : ''}">${label}</button>`;
                          }).join('')}
                        </div>`
                      : ''
                  }

                  ${
                    f.scheduleType === 'times_per_week'
                      ? `<div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px;">
                          <span style="font-size:13px; font-weight:600;">Ile razy w tygodniu:</span>
                          <div style="display:flex; gap:6px;">
                            ${[1, 2, 3, 4, 5, 6]
                              .map(
                                (n) => `
                              <button type="button" data-action="hm-set-times" data-times="${n}" class="day-pill-btn ${Number(f.timesPerWeek) === n ? 'selected' : ''}" style="width:34px; height:34px;">
                                ${n}×
                              </button>
                            `
                              )
                              .join('')}
                          </div>
                        </div>`
                      : ''
                  }
                </div>
              </div>

              <div class="ios-card">
                <div class="ios-row">
                  <div class="row-info">
                    <div class="row-title">Godzina wykonania (opcjonalnie)</div>
                    <div class="row-subtitle">Wyświetlana przy nawyku na liście Dzisiaj</div>
                  </div>
                  <input id="hm-exec-time" type="time" value="${escapeHtml(f.executionTime)}" />
                </div>

                <div class="ios-row">
                  <div class="row-info">
                    <div class="row-title">Ważny nawyk</div>
                    <div class="row-subtitle">Subtelne wyróżnienie priorytetu na liście</div>
                  </div>
                  <button
                    type="button"
                    role="switch"
                    aria-checked="${f.important}"
                    data-action="hm-toggle-important"
                    class="ios-switch ${f.important ? 'on-blue' : ''}"
                  >
                    <span class="ios-switch-thumb"></span>
                  </button>
                </div>

                <div class="ios-row">
                  <div class="row-info">
                    <div class="row-title">Przypomnienie</div>
                    <div class="row-subtitle">Powiadomienie w zaplanowane dni</div>
                  </div>
                  <button
                    type="button"
                    role="switch"
                    aria-checked="${f.reminderEnabled}"
                    data-action="hm-toggle-reminder"
                    class="ios-switch ${f.reminderEnabled ? 'on' : ''}"
                  >
                    <span class="ios-switch-thumb"></span>
                  </button>
                </div>

                ${
                  f.reminderEnabled
                    ? `<div class="ios-row">
                        <span class="row-title">Godzina przypomnienia</span>
                        <input id="hm-rem-time" type="time" value="${escapeHtml(f.reminderTime)}" />
                      </div>`
                    : ''
                }

                <div class="ios-row-stack">
                  <label for="hm-note" style="font-size:12px; font-weight:600; color:var(--text-secondary);">KRÓTKA NOTATKA (OPCJONALNIE)</label>
                  <input id="hm-note" type="text" placeholder="np. Po porannej kawie" value="${escapeHtml(f.note)}" style="width:100%;" />
                </div>
              </div>

              ${
                f.isEdit
                  ? `<div class="ios-card">
                      <div class="ios-row">
                        <button type="button" data-action="hm-toggle-pause" class="btn btn-secondary" style="flex:1;">
                          ${f.status === 'paused' ? '▶ Wznów nawyk' : '⏸ Wstrzymaj tymczasowo'}
                        </button>
                        <button type="button" data-action="hm-toggle-archive" class="btn btn-secondary" style="flex:1;">
                          ${f.status === 'archived' ? 'Przywróć z archiwum' : '📦 Archiwizuj'}
                        </button>
                      </div>
                      <div class="ios-row-stack">
                        ${
                          !f.confirmDelete
                            ? `<button type="button" data-action="hm-ask-delete" class="btn btn-danger-soft" style="width:100%;">
                                × Usuń nawyk oraz jego historię
                              </button>`
                            : `<div style="display:flex; gap:8px;">
                                <button type="button" data-action="hm-cancel-delete" class="btn btn-secondary" style="flex:1;">Anuluj</button>
                                <button type="button" data-action="hm-confirm-delete" data-habit-id="${escapeHtml(f.id)}" class="btn btn-danger" style="flex:1;">Potwierdź usunięcie</button>
                              </div>`
                        }
                      </div>
                    </div>`
                  : ''
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderPeriodModal() {
      if (!state.periodModalOpen || !state.periodForm) return '';
      const pf = state.periodForm;

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-sheet">
            <div class="modal-topbar">
              <button type="button" data-action="close-period-modal" style="font-size:14px; color:var(--text-secondary);">Anuluj</button>
              <span style="font-size:16px; font-weight:700;">${pf.isEdit ? 'Edytuj okres' : 'Oznacz okres w kalendarzu'}</span>

                      ${escapeHtml(pf.error)}

                <div style="font-size:11px; font-weight:600; color:var(--text-secondary); margin-bottom:6px;">

                  <label for="pm-name" style="font-size:12px; font-weight:600; color:var(--text-secondary);">NAZWA OKRESU (NP. WYJAZD, URLOP) *</label>

                  <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">KOLOR WSTĘGI W KALENDARZU</span>

                    ${Object.values(PERIOD_COLORS)

                        (c) => `
                      <button
                        type="button"
                        data-action="pm-set-color"
                        data-color="${c.id}"
                        class="pill ${c.badgeClass}"
                        style="padding:7px 11px; font-size:12px; ${pf.color === c.id ? 'outline:2px solid var(--text-primary);' : ''}"

                        <span style="width:9px; height:9px; border-radius:50%; background:${c.hex};"></span>

            </div>
          </div>
        </div>
      `;
    }

    function renderHabitDetailModal(completionMap) {
      if (!state.detailHabitId) return '';
      const habit = state.habits.find((h) => h.id === state.detailHabitId);
      if (!habit) return '';

      const todayStr = state.todayStr;
      const weekStartsOn = state.settings.weekStartsOn;
      const orderedDays = getOrderedWeekDays(weekStartsOn);

      const stats = calculateHabitStats(
        habit,
        todayStr,
        state.detailMonthYear.year,
        state.detailMonthYear.month,
        completionMap,
        weekStartsOn
      );

      const cells = getCalendarGridDays(
        state.detailMonthYear.year,
        state.detailMonthYear.month,
        weekStartsOn
      );

      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-sheet">
            <div class="modal-topbar">
              <button type="button" data-action="close-habit-detail" style="font-size:14px; color:var(--text-secondary);">Zamknij</button>
              <span style="font-size:14px; font-weight:700;">Historia nawyku</span>
              <div style="display:flex; align-items:center; gap:8px;">
                <button type="button" data-action="edit-habit" data-habit-id="${escapeHtml(habit.id)}" style="font-size:14px; font-weight:700; color:var(--ios-blue);">Edytuj</button>
                <button type="button" data-action="detail-ask-delete" class="btn-icon-x" style="width:28px; height:28px;" title="Usuń nawyk">×</button>
              </div>
            </div>

            <div class="modal-body">
              ${
                state.detailConfirmDelete
                  ? `<div style="padding:12px; border-radius:14px; background:var(--ios-red-soft); border:1px solid var(--ios-red); margin-bottom:14px;">
                      <div style="font-size:13px; font-weight:700; color:var(--ios-red); margin-bottom:8px;">
                        Usunąć trwale nawyk „${escapeHtml(habit.name)}” wraz z historią?
                      </div>
                      <div style="display:flex; gap:8px;">
                        <button type="button" data-action="detail-cancel-delete" class="btn btn-secondary" style="flex:1;">Anuluj</button>
                        <button type="button" data-action="detail-confirm-delete" data-habit-id="${escapeHtml(habit.id)}" class="btn btn-danger" style="flex:1;">Tak, usuń</button>
                      </div>
                    </div>`
                  : ''
              }

              <div style="margin-bottom:14px;">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                  <h2 style="font-size:20px; font-weight:700;">${escapeHtml(habit.name)}</h2>
                  ${habit.important ? `<span class="pill pill-blue">Ważny</span>` : ''}
                </div>
                <p style="font-size:12px; color:var(--text-secondary); margin-top:2px;">
                  Harmonogram: <strong>${escapeHtml(formatScheduleLabel(habit.schedule))}</strong>
                  ${habit.executionTime ? ` • Godzina: ${escapeHtml(habit.executionTime)}` : ''}
                </p>
              </div>

              <div class="stats-3-grid">
                <div class="stat-box">
                  <div class="stat-label">🔥 Bieżąca seria</div>
                  <div class="stat-value">${stats.currentStreak}</div>
                  <div class="stat-sub">okazji z rzędu</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">🏆 Najlepsza</div>
                  <div class="stat-value">${stats.bestStreak}</div>
                  <div class="stat-sub">rekord</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">📅 W miesiącu</div>
                  <div class="stat-value">${stats.monthCompletionRate}%</div>
                  <div class="stat-sub">${stats.monthCompletedCount}/${stats.monthScheduledCount} dni</div>
                </div>
              </div>

              <div class="ios-card-padded" style="margin-bottom:0;">
                <div class="calendar-header">
                  <button type="button" data-action="detail-prev-month" class="calendar-nav-btn">‹</button>
                  <span style="font-size:14px; font-weight:700;">
                    ${escapeHtml(formatPolishMonthYear(state.detailMonthYear.year, state.detailMonthYear.month))}
                  </span>
                  <button type="button" data-action="detail-next-month" class="calendar-nav-btn">›</button>
                </div>

                <div class="calendar-grid">
                  ${orderedDays.map((d) => `<div class="calendar-dow">${d.label}</div>`).join('')}
                  ${cells
                    .map(({ dateStr, inCurrentMonth }) => {
                      const st = getHabitDayState(habit, dateStr, todayStr, completionMap, weekStartsOn);
                      const dayNum = Number(dateStr.split('-')[2]);
                      const ribbon = getPeriodRibbonInfo(dateStr);
                      const canToggle = st !== 'future';

                      let btnCls = 'cal-day-btn';
                      if (!inCurrentMonth) btnCls += ' outside';
                      if (st === 'completed') btnCls += ' habit-done';
                      else if (st === 'missed') btnCls += ' habit-missed';
                      else if (st === 'today_pending') btnCls += ' today';

                      return `
                        <div class="cal-cell-wrap ${ribbon ? `${ribbon.meta.bgClass} ${ribbon.shapeClass}` : ''}">
                          ${ribbon ? `<span class="cal-period-top-bar ${ribbon.meta.barClass}" title="${escapeHtml(ribbon.period.name)}"></span>` : ''}
                          <button
                            type="button"
                            ${!canToggle ? 'disabled' : ''}
                            data-action="detail-toggle-date"
                            data-habit-id="${escapeHtml(habit.id)}"
                            data-date="${dateStr}"
                            class="${btnCls}"
                          >
                            <span>${dayNum}</span>
                          </button>
                        </div>
                      `;
                    })
                    .join('')}
                </div>

                <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:11px; color:var(--text-secondary);">
                  <span>🟢 Wykonany</span>
                  <span>🔴 Zaległy</span>
                  <span>🔵 Dzisiaj</span>
                  <span>🟠 Wstęga = Oznaczony okres (np. wyjazd)</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const t = state.activeTab;
      return `
        <nav class="bottom-nav" aria-label="Główna nawigacja">
          <div class="bottom-nav-inner">
            <button type="button" data-action="switch-tab" data-tab="today" class="nav-tab-btn ${t === 'today' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'today' ? '2.4' : '1.9'}">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Dzisiaj</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="planner" class="nav-tab-btn ${t === 'planner' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'planner' ? '2.4' : '1.9'}">
                <rect x="3" y="4" width="18" height="18" rx="3" />
                <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18" />
              </svg>
              <span>Planer</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="settings" class="nav-tab-btn ${t === 'settings' ? 'active' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${t === 'settings' ? '2.4' : '1.9'}">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
              <span>Ustawienia</span>
            </button>
          </div>
        </nav>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      const completionMap = buildCompletionMap(state.completions);

      let mainHtml = '';
      if (state.activeTab === 'today') {
        mainHtml =
          state.internalView === 'overall_history'
            ? renderOverallHistoryView(completionMap)
            : renderTodayView(completionMap);
      } else if (state.activeTab === 'planner') {
        mainHtml = renderPlannerView(completionMap);
      } else {
        mainHtml = renderSettingsView();
      }

      root.innerHTML = `
        ${state.toast ? `<div class="toast-banner">${escapeHtml(state.toast)}</div>` : ''}
        ${renderStickyHeader(completionMap)}
        <main class="main-container">${mainHtml}</main>
        ${renderBottomNav()}
        ${renderHabitModal()}
        ${renderPeriodModal()}
        ${renderHabitDetailModal(completionMap)}
      `;
    }

    /***********************************************************************
     * 12. DELEGACJA ZDARZEŃ (OBSŁUGA WSZYSTKICH KLIKNIĘĆ I FORMULARZY)
     ***********************************************************************/
    function syncHabitModalInputs() {
      const f = state.habitForm;
      if (!f) return;
      const nameEl = document.getElementById('hm-name');
      const execEl = document.getElementById('hm-exec-time');
      const remEl = document.getElementById('hm-rem-time');
      const noteEl = document.getElementById('hm-note');
      if (nameEl) f.name = nameEl.value;
      if (execEl) f.executionTime = execEl.value;
      if (remEl) f.reminderTime = remEl.value;
      if (noteEl) f.note = noteEl.value;
    }

    function syncPeriodModalInputs() {
      const pf = state.periodForm;
      if (!pf) return;
      const nEl = document.getElementById('pm-name');
      const sEl = document.getElementById('pm-start');
      const eEl = document.getElementById('pm-end');
      const noteEl = document.getElementById('pm-note');
      if (nEl) pf.name = nEl.value;
      if (sEl) pf.startDate = sEl.value;
      if (eEl) pf.endDate = eEl.value;
      if (noteEl) pf.note = noteEl.value;
    }

    function syncPlannerFormInputs() {
      const pf = state.plannerForm;
      if (!pf) return;
      const cEl = document.getElementById('pf-content');
      const dEl = document.getElementById('pf-description');
      const tEl = document.getElementById('pf-time');
      const lEl = document.getElementById('pf-linked-habit');
      if (cEl) pf.content = cEl.value;
      if (dEl) pf.description = dEl.value;
      if (tEl) pf.time = tEl.value;
      if (lEl) pf.linkedHabitId = lEl.value;
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'switch-tab': {
          state.activeTab = btn.getAttribute('data-tab') || 'today';
          state.internalView = null;
          state.inlineDeleteHabitId = null;
          state.inlineDeletePeriodId = null;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        }
        case 'open-overall-history':
          state.internalView = 'overall_history';
          renderApp();
          break;
        case 'close-overall-history':
          state.internalView = null;
          renderApp();
          break;
        case 'set-history-mode':
          state.historyMode = btn.getAttribute('data-mode') || 'year';
          renderApp();
          break;
        case 'select-history-date':
          state.historySelectedDate = btn.getAttribute('data-date') || state.todayStr;
          renderApp();
          break;
        case 'history-prev-month': {
          const d = new Date(state.historyMonthYear.year, state.historyMonthYear.month - 1, 1, 12, 0, 0);
          state.historyMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'history-next-month': {
          const d = new Date(state.historyMonthYear.year, state.historyMonthYear.month + 1, 1, 12, 0, 0);
          state.historyMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'toggle-habit-today': {
          const hId = btn.getAttribute('data-habit-id');
          if (hId) await toggleHabitCompletion(hId, state.todayStr);
          break;
        }
        case 'open-add-habit':
          openHabitModal(null);
          break;
        case 'edit-habit': {
          const hId = btn.getAttribute('data-habit-id');
          const h = state.habits.find((x) => x.id === hId);
          state.detailHabitId = null;
          if (h) openHabitModal(h);
          break;
        }
        case 'close-habit-modal':
          state.habitModalOpen = false;
          state.habitForm = null;
          renderApp();
          break;
        case 'save-habit-modal':
          syncHabitModalInputs();
          await saveHabitModalForm();
          break;
        case 'apply-habit-suggestion': {
          syncHabitModalInputs();
          const idx = Number(btn.getAttribute('data-index'));
          const sug = STARTER_SUGGESTIONS[idx];
          if (sug && state.habitForm) {
            state.habitForm.name = sug.name;
            state.habitForm.executionTime = sug.executionTime || '';
            state.habitForm.scheduleType = sug.schedule.type;
            if (sug.schedule.daysOfWeek) state.habitForm.daysOfWeek = [...sug.schedule.daysOfWeek];
            if (sug.schedule.timesPerWeek) state.habitForm.timesPerWeek = sug.schedule.timesPerWeek;
            state.habitForm.note = sug.note || '';
            renderApp();
          }
          break;
        }
        case 'hm-set-schedule':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.scheduleType = btn.getAttribute('data-type') || 'daily';
            renderApp();
          }
          break;
        case 'hm-toggle-day': {
          syncHabitModalInputs();
          const day = Number(btn.getAttribute('data-day'));
          if (state.habitForm) {
            const arr = state.habitForm.daysOfWeek || [];
            state.habitForm.daysOfWeek = arr.includes(day)
              ? arr.filter((d) => d !== day)
              : [...arr, day];
            renderApp();
          }
          break;
        }
        case 'hm-set-times':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.timesPerWeek = Number(btn.getAttribute('data-times')) || 3;
            renderApp();
          }
          break;
        case 'hm-toggle-important':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.important = !state.habitForm.important;
            renderApp();
          }
          break;
        case 'hm-toggle-reminder':
          syncHabitModalInputs();
          if (state.habitForm) {
            const next = !state.habitForm.reminderEnabled;
            if (next) {
              const perm = await requestNotificationPermissionInteractive();
              state.habitForm.reminderEnabled = perm.granted;
              showToast(perm.message);
            } else {
              state.habitForm.reminderEnabled = false;
            }
            renderApp();
          }
          break;
        case 'hm-toggle-pause':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.status = state.habitForm.status === 'paused' ? 'active' : 'paused';
            renderApp();
          }
          break;
        case 'hm-toggle-archive':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.status = state.habitForm.status === 'archived' ? 'active' : 'archived';
            renderApp();
          }
          break;
        case 'hm-ask-delete':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.confirmDelete = true;
            renderApp();
          }
          break;
        case 'hm-cancel-delete':
          syncHabitModalInputs();
          if (state.habitForm) {
            state.habitForm.confirmDelete = false;
            renderApp();
          }
          break;
        case 'hm-confirm-delete': {
          const hId = btn.getAttribute('data-habit-id') || state.habitForm?.id;
          await deleteHabitEverywhere(hId);
          break;
        }
        case 'open-habit-detail': {
          const hId = btn.getAttribute('data-habit-id');
          const d = parseLocalDate(state.todayStr);
          state.detailHabitId = hId;
          state.detailConfirmDelete = false;
          state.detailMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'close-habit-detail':
          state.detailHabitId = null;
          state.detailConfirmDelete = false;
          renderApp();
          break;
        case 'detail-ask-delete':
          state.detailConfirmDelete = true;
          renderApp();
          break;
        case 'detail-cancel-delete':
          state.detailConfirmDelete = false;
          renderApp();
          break;
        case 'detail-confirm-delete': {
          const hId = btn.getAttribute('data-habit-id') || state.detailHabitId;
          await deleteHabitEverywhere(hId);
          break;
        }
        case 'detail-prev-month': {
          const d = new Date(state.detailMonthYear.year, state.detailMonthYear.month - 1, 1, 12, 0, 0);
          state.detailMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'detail-next-month': {
          const d = new Date(state.detailMonthYear.year, state.detailMonthYear.month + 1, 1, 12, 0, 0);
          state.detailMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'detail-toggle-date': {
          const hId = btn.getAttribute('data-habit-id');
          const dStr = btn.getAttribute('data-date');
          if (hId && dStr) await toggleHabitCompletion(hId, dStr);
          break;
        }
        case 'inline-ask-delete-habit':
          state.inlineDeleteHabitId = btn.getAttribute('data-habit-id');
          renderApp();
          break;
        case 'inline-cancel-delete-habit':
          state.inlineDeleteHabitId = null;
          renderApp();
          break;
        case 'inline-confirm-delete-habit': {
          const hId = btn.getAttribute('data-habit-id');
          await deleteHabitEverywhere(hId);
          break;
        }
        case 'open-period-modal':
          openPeriodModal(null);
          break;
        case 'edit-period': {
          const pId = btn.getAttribute('data-period-id');
          const per = state.periods.find((p) => p.id === pId);
          if (per) openPeriodModal(per);
          break;
        }
        case 'close-period-modal':
          state.periodModalOpen = false;
          state.periodForm = null;
          renderApp();
          break;
        case 'save-period-modal':
          syncPeriodModalInputs();
          await savePeriodModalForm();
          break;
        case 'apply-period-preset':
          syncPeriodModalInputs();
          if (state.periodForm) {
            state.periodForm.name = btn.getAttribute('data-name') || 'Wyjazd';
            state.periodForm.color = btn.getAttribute('data-color') || 'amber';
            renderApp();
          }
          break;
        case 'pm-set-color':
          syncPeriodModalInputs();
          if (state.periodForm) {
            state.periodForm.color = btn.getAttribute('data-color') || 'amber';
            renderApp();
          }
          break;
        case 'delete-period-direct':
        case 'inline-confirm-delete-period': {
          const pId = btn.getAttribute('data-period-id');
          await deletePeriodEverywhere(pId);
          break;
        }
        case 'inline-ask-delete-period':
          state.inlineDeletePeriodId = btn.getAttribute('data-period-id');
          renderApp();
          break;
        case 'inline-cancel-delete-period':
          state.inlineDeletePeriodId = null;
          renderApp();
          break;
        case 'planner-prev-month': {
          const d = new Date(state.plannerMonthYear.year, state.plannerMonthYear.month - 1, 1, 12, 0, 0);
          state.plannerMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'planner-next-month': {
          const d = new Date(state.plannerMonthYear.year, state.plannerMonthYear.month + 1, 1, 12, 0, 0);
          state.plannerMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'planner-select-date':
          state.plannerSelectedDate = btn.getAttribute('data-date') || state.todayStr;
          renderApp();
          break;
        case 'planner-jump-today': {
          const d = parseLocalDate(state.todayStr);
          state.plannerSelectedDate = state.todayStr;
          state.plannerMonthYear = { year: d.getFullYear(), month: d.getMonth() };
          renderApp();
          break;
        }
        case 'set-planner-mode':
          state.plannerMode = btn.getAttribute('data-mode') || 'period';
          renderApp();
          break;
        case 'open-planner-form':
          openPlannerForm(null, 'morning');
          break;
        case 'open-planner-form-period':
          openPlannerForm(null, btn.getAttribute('data-period') || 'morning');
          break;
        case 'close-planner-form':
          state.plannerFormOpen = false;
          state.plannerForm = null;
          renderApp();
          break;
        case 'pf-set-period':
          syncPlannerFormInputs();
          if (state.plannerForm) {
            state.plannerForm.timeOfDay = btn.getAttribute('data-period') || 'morning';
            renderApp();
          }
          break;
        case 'toggle-planner-done': {
          const id = btn.getAttribute('data-entry-id');
          const entry = state.plannerEntries.find((x) => x.id === id);
          if (entry) {
            entry.done = !entry.done;
            entry.updatedAt = Date.now();
            await dbPut('planner_entries', entry);
            renderApp();
          }
          break;
        }
        case 'edit-planner-entry': {
          const id = btn.getAttribute('data-entry-id');
          const entry = state.plannerEntries.find((x) => x.id === id);
          if (entry) openPlannerForm(entry);
          break;
        }
        case 'delete-planner-entry': {
          const id = btn.getAttribute('data-entry-id');
          if (id) {
            await dbDelete('planner_entries', id);
            state.plannerEntries = state.plannerEntries.filter((x) => x.id !== id);
            renderApp();
          }
          break;
        }
        case 'move-planner-entry': {
          const id = btn.getAttribute('data-entry-id');
          const dir = Number(btn.getAttribute('data-dir')) || -1;
          const entry = state.plannerEntries.find((x) => x.id === id);
          if (entry) {
            const list = state.plannerEntries
              .filter((x) => x.date === state.plannerSelectedDate && (x.timeOfDay || 'morning') === (entry.timeOfDay || 'morning'))
              .sort((a, b) => (a.order || 0) - (b.order || 0));
            const idx = list.findIndex((x) => x.id === id);
            const swapIdx = idx + dir;
            if (idx >= 0 && swapIdx >= 0 && swapIdx < list.length) {
              const a = list[idx];
              const b = list[swapIdx];
              const tmp = a.order || idx;
              a.order = b.order || swapIdx;
              b.order = tmp;
              await dbSavePlannerBatch([a, b]);
              renderApp();
            }
          }
          break;
        }
        case 'set-theme':
          await updateSettings({ theme: btn.getAttribute('data-theme') || 'system' });
          break;
        case 'toggle-dark-mode-switch': {
          const nextTheme = isDarkActive() ? 'light' : 'dark';
          await updateSettings({ theme: nextTheme });
          break;
        }
        case 'set-week-start':
          await updateSettings({ weekStartsOn: Number(btn.getAttribute('data-day')) === 0 ? 0 : 1 });
          break;
        case 'toggle-show-periods':
          await updateSettings({ showPeriodsOnCalendar: state.settings.showPeriodsOnCalendar === false });
          break;
        case 'toggle-never-miss-twice':
          await updateSettings({ neverMissTwiceAlerts: state.settings.neverMissTwiceAlerts === false });
          break;
        case 'toggle-global-notifications': {
          if (!state.settings.notificationsEnabled) {
            const res = await requestNotificationPermissionInteractive();
            await updateSettings({ notificationsEnabled: res.granted });
            showToast(res.message);
          } else {
            await updateSettings({ notificationsEnabled: false });
            showToast('Wyłączono przypomnienia lokalne.');
          }
          break;
        }
        case 'request-notifications': {
          const res = await requestNotificationPermissionInteractive();
          await updateSettings({ notificationsEnabled: res.granted });
          showToast(res.message);
          break;
        }
        case 'test-notification': {
          const ok = await sendImmediateNotification(
            'Rutyna – test powiadomień',
            'Powiadomienia lokalne działają prawidłowo!'
          );
          showToast(ok ? 'Wysłano powiadomienie testowe.' : 'Najpierw włącz uprawnienia do powiadomień.');
          break;
        }
        case 'export-json': {
          const payload = {
            schemaVersion: DB_VERSION,
            exportedAt: new Date().toISOString(),
            app: 'Rutyna',
            habits: state.habits,
            completions: state.completions,
            plannerEntries: state.plannerEntries,
            periods: state.periods,
            settings: state.settings
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `rutyna-kopia-${state.todayStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Pobrano kopię zapasową JSON.');
          break;
        }
        case 'import-json-trigger': {
          const inp = document.getElementById('backup-file-input');
          if (inp) inp.click();
          break;
        }
        case 'cancel-import-json':
          state.pendingBackupImport = null;
          renderApp();
          break;
        case 'confirm-import-json':
          if (state.pendingBackupImport) {
            await dbRestoreBackup(state.pendingBackupImport);
            state.pendingBackupImport = null;
            await loadAllData();
            showToast('Odtworzono dane z kopii zapasowej.');
          }
          break;
        case 'export-csv-habits':
          exportHabitsAndHistoryToCSV();
          showToast('Pobrano plik CSV (Nawyki i historia).');
          break;
        case 'export-csv-planner':
          exportPlannerAndPeriodsToCSV();
          showToast('Pobrano plik CSV (Planer i okresy).');
          break;
        case 'ask-clear-all-data':
          state.confirmClearAllData = true;
          renderApp();
          break;
        case 'cancel-clear-all-data':
          state.confirmClearAllData = false;
          renderApp();
          break;
        case 'confirm-clear-all-data':
          await dbClearAllData();
          state.habits = [];
          state.completions = [];
          state.plannerEntries = [];
          state.periods = [];
          state.settings = { ...DEFAULT_SETTINGS };
          state.confirmClearAllData = false;
          applyTheme();
          showToast('Wyczyszczono wszystkie dane z bazy.');
          renderApp();
          break;
        case 'run-unit-tests':
          state.unitTestResults = runBuiltInUnitTests();
          renderApp();
          break;
        case 'hide-unit-tests':
          state.unitTestResults = null;
          renderApp();
          break;
      }
    });

    document.addEventListener('submit', async (e) => {
      if (e.target && e.target.id === 'planner-entry-form') {
        e.preventDefault();
        syncPlannerFormInputs();
        await savePlannerForm();
      }
    });

    document.getElementById('backup-file-input')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      try {
        const text = await file.text();
        const raw = JSON.parse(text);
        state.pendingBackupImport = validateBackupPayload(raw);
        renderApp();
      } catch (err) {
        showToast(err instanceof Error ? err.message : 'Nieprawidłowy plik kopii zapasowej JSON.');
      }
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.settings.theme === 'system') applyTheme();
    });

    initPWA();
    loadAllData();
  </script>
</body>
</html>
