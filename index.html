    /* ============================================================
       Przypomnienia
       ============================================================ */
    async function showNotification(title, body, tag) {
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg && 'showNotification' in reg) {
            await reg.showNotification(title, {
              body,
              tag,
              icon: 'icons/icon-192.png',
              badge: 'icons/icon-192.png',
              data: { url: './' }
            });
            return true;
          }
        }
        new Notification(title, { body, tag, icon: 'icons/icon-192.png' });
        return true;
      } catch {
        return false;
      }
    }

    const minutesOf = (t) => {
      const [h, m] = String(t).split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    };

    let reminderBusy = false;
    async function checkReminders() {
      if (reminderBusy || !state.ready) return;
      const env = notifEnv();
      if (!state.settings.notificationsEnabled || env.permission !== 'granted') return;
      reminderBusy = true;
      try {
        const ctx = ctxNow();
        const now = minutesOf(nowTime());
        const log = { ...(state.settings.reminderLog || {}) };
        let changed = false;
        for (const h of state.habits) {
          if (h.status !== 'active' || !h.reminder?.enabled) continue;
          const t = h.reminder.time || h.executionTime;
          if (!t || log[h.id] === ctx.today) continue;
          const due = minutesOf(t);
          if (now < due) continue;
          log[h.id] = ctx.today;
          changed = true;
          if (!isPlannedOn(h, ctx.today, ctx.map, ctx.ws, ctx.today)) continue;
          if (isDone(h.id, ctx.today, ctx.map)) continue;
          // Jeśli aplikacja wybudziła się dużo później, nie wysyłamy spóźnionego powiadomienia.
          if (now - due > 45) continue;
          await showNotification(h.name, h.note || `Zaplanowane na ${t}`, `rutyna-${h.id}-${ctx.today}`);
        }
        for (const id of Object.keys(log)) if (!findHabit(id)) delete log[id];
        if (changed) await updateSettings({ reminderLog: log }, false);
      } finally {
        reminderBusy = false;
      }
    }

    async function ensurePermission() {
      const env = notifEnv();
      if (!env.supported) {
        toast(
          env.iOS && !env.standalone
            ? 'Najpierw dodaj Rutynę do ekranu początkowego'
            : 'Ta przeglądarka nie obsługuje powiadomień'
        );
        return false;
      }
      if (env.permission === 'granted') return true;
      if (env.permission === 'denied') {
        toast('Powiadomienia są zablokowane w ustawieniach systemu');
        return false;
      }
      try {
        const res = await Notification.requestPermission();
        if (res === 'granted') return true;
      } catch {
        /* brak */
      }
      toast('Bez zgody na powiadomienia przypomnienia nie zadziałają');
      return false;
    }

    function icsEscape(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    }
    function icsFold(line) {
      const out = [];
      let rest = line;
      while (rest.length > 60) {
        out.push(rest.slice(0, 60));
        rest = ' ' + rest.slice(60);
      }
      out.push(rest);
      return out.join('\r\n');
    }
    function buildICS(list, today) {
      const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      const f = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Rutyna//PL', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Rutyna'];
      for (const h of list) {
        const t = (h.reminder?.enabled && h.reminder.time) || h.executionTime;
        const [hh, mm] = t.split(':').map(Number);
        const s = h.schedule || { type: 'daily' };
        let day = today;
        let rrule = 'FREQ=DAILY';
        if (s.type === 'specific_days' && s.daysOfWeek?.length) {
          rrule = `FREQ=WEEKLY;BYDAY=${[...s.daysOfWeek].sort((a, b) => a - b).map((d) => BY[d]).join(',')}`;
          for (let i = 0; i < 7 && !s.daysOfWeek.includes(dow(day)); i++) day = addDays(day, 1);
        }
        const start = parseDate(day);
        start.setHours(hh || 0, mm || 0, 0, 0);
        const end = new Date(start.getTime() + 15 * 60000);
        lines.push(
          'BEGIN:VEVENT',
          `UID:${h.id}@rutyna`,
          `DTSTAMP:${stamp}`,
          `DTSTART:${f(start)}`,
          `DTEND:${f(end)}`,
          `RRULE:${rrule}`,
          `SUMMARY:${icsEscape(h.name)}`
        );
        if (h.note) lines.push(`DESCRIPTION:${icsEscape(h.note)}`);
        lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(h.name)}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
      }
      lines.push('END:VCALENDAR');
      return lines.map(icsFold).join('\r\n') + '\r\n';
    }

    /* ============================================================
       Pliki: kopia, CSV, kalendarz
       ============================================================ */
    async function deliverFile(name, mime, content) {
      const blob = new Blob([content], { type: mime });
      const touch = window.matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare && typeof File === 'function') {
        try {
          const file = new File([blob], name, { type: mime });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
            return true;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return false;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    }

    function csvField(v) {
      const s = String(v ?? '').replace(/\r?\n/g, ' ');
      return /[;"]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }
    const csv = (headers, rows) => '\uFEFF' + [headers, ...rows].map((r) => r.map(csvField).join(';')).join('\r\n');
    const STATUS_PL = { active: 'Aktywny', paused: 'Wstrzymany', archived: 'W archiwum' };

    function habitsCsv() {
      const headers = ['Nawyk', 'Status', 'Harmonogram', 'Ważny', 'Godzina', 'Dodany', 'Data wykonania', 'Okres', 'Notatka'];
      const rows = [];
      const sorted = [...state.habits].sort((a, b) => a.name.localeCompare(b.name, 'pl'));
      for (const h of sorted) {
        const done = state.completions.filter((c) => c.habitId === h.id && c.completed).sort((a, b) => a.date.localeCompare(b.date));
        const base = [h.name, STATUS_PL[h.status] || '', scheduleLabel(h.schedule), h.important ? 'Tak' : 'Nie', h.executionTime || '', h.createdAt];
        if (!done.length) rows.push([...base, '', '', h.note || '']);
        for (const c of done) rows.push([...base, c.date, periodsOn(c.date).map((p) => p.name).join(', '), h.note || '']);
      }
      return csv(headers, rows);
    }
    function plannerCsv() {
      const partPl = { morning: 'Rano', afternoon: 'Popołudnie', evening: 'Wieczór' };
      const headers = ['Rodzaj', 'Data', 'Pora dnia', 'Godzina', 'Treść', 'Szczegóły', 'Nawyk', 'Okres tego dnia', 'Status'];
      const rows = [...state.entries]
        .sort((a, b) => a.date.localeCompare(b.date) || (a.order || 0) - (b.order || 0))
        .map((e) => [
          'Wpis',
          e.date,
          partPl[e.timeOfDay] || 'Rano',
          e.time || '',
          e.content,
          e.description || '',
          findHabit(e.linkedHabitId)?.name || '',
          periodsOn(e.date).map((p) => p.name).join(', '),
          e.done ? 'Zrobione' : 'Do zrobienia'
        ]);
      [...state.periods]
        .sort((a, b) => a.startDate.localeCompare(b.startDate))
        .forEach((p) => rows.push(['Okres', `${p.startDate} – ${p.endDate}`, '', '', p.name, p.note || '', '', '', colorLabel(p.color)]));
      return csv(headers, rows);
    }

    function validateBackup(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('To nie jest plik kopii.');
      if (raw.app !== 'Rutyna' || typeof raw.schemaVersion !== 'number') throw new Error('Ten plik nie jest kopią Rutyny.');
      if (!Array.isArray(raw.habits) || !Array.isArray(raw.completions) || !Array.isArray(raw.plannerEntries)) {
        throw new Error('Kopia jest niekompletna.');
      }
      const today = toDateStr();
      const habits = raw.habits.map((h) => {
        if (!h || typeof h.id !== 'string' || typeof h.name !== 'string') throw new Error('Kopia zawiera uszkodzony nawyk.');
        return migrateHabit({ status: 'active', createdAt: today, ...h }, today).habit;
      });
      const periodsRaw = Array.isArray(raw.periods) ? raw.periods : Array.isArray(raw.calendarPeriods) ? raw.calendarPeriods : [];
      const dateRe = /^\d{4}-\d{2}-\d{2}$/;
      return {
        habits,
        completions: raw.completions
          .filter((c) => c && typeof c.habitId === 'string' && dateRe.test(c.date))
          .map((c) => ({ ...c, id: `${c.habitId}_${c.date}`, completed: Boolean(c.completed) })),
        plannerEntries: raw.plannerEntries
          .filter((e) => e && typeof e.id === 'string' && dateRe.test(e.date))
          .map((e) => migrateEntry(e).entry),
        periods: periodsRaw.filter(
          (p) => p && typeof p.id === 'string' && typeof p.name === 'string' && dateRe.test(p.startDate) && dateRe.test(p.endDate)
        ),
        settings: { ...DEFAULT_SETTINGS, ...(raw.settings || {}), id: 'user_settings' }
      };
    }

    /* ============================================================
       Akcje (delegacja kliknięć)
       ============================================================ */
    const form = () => state.sheet && state.sheet.form;
    const markDirty = () => {
      if (form()) form().dirty = true;
    };

    const ACTIONS = {
      tab(el) {
        const next = el.dataset.tab;
        if (next === state.tab) {
          window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
          return;
        }
        state.scroll[state.tab] = window.scrollY;
        state.tab = next;
        state.menu = null;
        state.planner.editing = false;
        render();
        window.scrollTo(0, state.scroll[next] || 0);
        updateScrolled();
      },

      'add-habit'() {
        openHabitForm();
      },
      'open-detail'(el) {
        openDetail(el.dataset.id);
      },
      'toggle-today'(el) {
        toggleCompletion(el.dataset.id, state.today);
      },
      'toggle-day'(el) {
        toggleCompletion(el.dataset.id, el.dataset.date);
      },

      'history-mode'(el) {
        state.history.mode = el.dataset.value;
        const d = parseDate(state.history.date);
        state.history.y = d.getFullYear();
        state.history.m = d.getMonth();
        render();
      },
      'history-select'(el) {
        state.history.date = el.dataset.date;
        const d = parseDate(el.dataset.date);
        state.history.y = d.getFullYear();
        state.history.m = d.getMonth();
        render();
      },
      'history-month'(el) {
        Object.assign(state.history, shiftMonth(state.history.y, state.history.m, Number(el.dataset.dir)));
        render();
      },

      'detail-month'(el) {
        const s = state.sheet;
        Object.assign(s, shiftMonth(s.y, s.m, Number(el.dataset.dir)));
        render();
      },
      'detail-select'(el) {
        state.sheet.sel = el.dataset.date;
        render();
      },
      'detail-toggle'() {
        const s = state.sheet;
        if (s.sel > state.today) return;
        toggleCompletion(s.id, s.sel);
      },
      'edit-habit'(el) {
        const h = findHabit(el.dataset.id);
        if (!h) return;
        const keep = state.sheet && state.sheet.type === 'habitDetail' ? { y: state.sheet.y, m: state.sheet.m, sel: state.sheet.sel } : null;
        const returnTo = keep ? 'detail' : null;
        state.sheet = null;
        openHabitForm(h, returnTo);
        if (keep) state.sheet.detailKeep = keep;
      },

      'form-schedule'(el) {
        form().scheduleType = el.dataset.value;
        markDirty();
        render();
      },
      'form-day'(el) {
        const f = form();
        const d = Number(el.dataset.day);
        f.days = f.days.includes(d) ? f.days.filter((x) => x !== d) : [...f.days, d];
        markDirty();
        render();
      },
      'form-times'(el) {
        form().times = Number(el.dataset.n);
        markDirty();
        render();
      },
      'form-toggle'(el) {
        const f = form();
        const k = el.dataset.key;
        f[k] = !f[k];
        markDirty();
        render();
      },
      async 'form-reminder'() {
        const f = form();
        if (f.reminder) {
          f.reminder = false;
          markDirty();
          render();
          return;
        }
        const ok = await ensurePermission();
        if (!ok || !state.sheet) {
          render();
          return;
        }
        if (!state.settings.notificationsEnabled) await updateSettings({ notificationsEnabled: true }, false);
        f.reminder = true;
        if (!f.reminderTouched) f.reminderTime = f.time || f.reminderTime || '08:00';
        markDirty();
        render();
      },
      'form-clear-time'() {
        form().time = '';
        markDirty();
        render();
      },
      'form-suggest'(el) {
        const x = STARTERS[Number(el.dataset.i)];
        const f = form();
        if (!x || !f) return;
        f.name = x.name;
        f.time = x.time;
        f.scheduleType = x.schedule.type;
        if (x.schedule.daysOfWeek) f.days = [...x.schedule.daysOfWeek];
        if (x.schedule.timesPerWeek) f.times = x.schedule.timesPerWeek;
        if (!f.reminderTouched) f.reminderTime = x.time || '08:00';
        markDirty();
        render();
      },
      'form-part'(el) {
        form().part = el.dataset.value;
        markDirty();
        render();
      },
      'form-color'(el) {
        form().color = el.dataset.color;
        markDirty();
        render();
      },
      'form-preset'(el) {
        const p = PERIOD_PRESETS[Number(el.dataset.i)];
        const f = form();
        f.name = p.name;
        f.color = p.color;
        markDirty();
        render();
      },

      async 'sheet-save'() {
        const t = state.sheet?.type;
        if (t === 'habitForm') await saveHabitForm();
        else if (t === 'entryForm') await saveEntryForm();
        else if (t === 'periodForm') await savePeriodForm();
      },
      'sheet-cancel'() {
        const s = state.sheet;
        if (s && s.type === 'habitForm' && s.returnTo === 'detail' && findHabit(s.form.id)) {
          backToDetail(s.form.id);
          return;
        }
        closeSheet();
      },
      'sheet-dismiss'() {
        if (sheetIsDirty()) return;
        closeSheet();
      },

      async 'habit-pause'() {
        const h = findHabit(form().id);
        if (!h) return;
        if (h.status === 'paused') await replaceHabitWithUndo(withResume(h, state.today), 'Wznowiono nawyk');
        else await replaceHabitWithUndo({ ...withPause(h, state.today), status: 'paused' }, 'Wstrzymano nawyk');
      },
      async 'habit-archive'() {
        const h = findHabit(form().id);
        if (!h) return;
        if (h.status === 'archived') await replaceHabitWithUndo(withResume(h, state.today), 'Przywrócono nawyk');
        else await replaceHabitWithUndo({ ...withPause(h, state.today), status: 'archived' }, 'Przeniesiono do archiwum');
      },
      'habit-delete'() {
        deleteHabit(form().id);
      },

      'planner-select'(el) {
        const d = el.dataset.date;
        state.planner.date = d;
        state.planner.editing = false;
        const p = parseDate(d);
        state.planner.y = p.getFullYear();
        state.planner.m = p.getMonth();
        render();
      },
      'planner-month'(el) {
        Object.assign(state.planner, shiftMonth(state.planner.y, state.planner.m, Number(el.dataset.dir)));
        render();
      },
      'planner-today'() {
        const p = parseDate(state.today);
        Object.assign(state.planner, { date: state.today, y: p.getFullYear(), m: p.getMonth(), editing: false });
        render();
      },
      'planner-menu'() {
        state.menu = state.menu ? null : 'planner';
        state.menuFocus = Boolean(state.menu);
        render();
      },
      'menu-close'() {
        state.menu = null;
        render();
      },
      'planner-edit'() {
        state.planner.editing = !state.planner.editing;
        render();
      },
      'new-entry'(el) {
        state.menu = null;
        openEntryForm(null, el.dataset.part || null);
      },
      'new-period'() {
        state.menu = null;
        openPeriodForm();
      },
      'edit-entry'(el) {
        const e = state.entries.find((x) => x.id === el.dataset.id);
        if (e) openEntryForm(e);
      },
      'edit-period'(el) {
        const p = state.periods.find((x) => x.id === el.dataset.id);
        if (p) openPeriodForm(p);
      },
      async 'entry-toggle'(el) {
        const e = state.entries.find((x) => x.id === el.dataset.id);
        if (!e) return;
        const next = { ...e, done: !e.done, updatedAt: Date.now() };
        const jobs = [saveEntryRecord(next)];
        if (next.linkedHabitId && findHabit(next.linkedHabitId)) jobs.push(setCompletion(next.linkedHabitId, next.date, next.done));
        render();
        await Promise.all(jobs);
      },
      'entry-delete'(el) {
        deleteEntry(el.dataset.id);
      },
      'entry-delete-form'() {
        deleteEntry(form().id);
      },
      async 'entry-move'(el) {
        const e = state.entries.find((x) => x.id === el.dataset.id);
        if (!e) return;
        const list = sortEntries(state.entries.filter((x) => x.date === e.date && x.timeOfDay === e.timeOfDay && !x.time));
        const i = list.indexOf(e);
        const j = i + Number(el.dataset.dir);
        if (i < 0 || j < 0 || j >= list.length) return;
        [list[i], list[j]] = [list[j], list[i]];
        const updated = list.map((x, k) => ({ ...x, order: k + 1 }));
        updated.forEach((u) => {
          const idx = state.entries.findIndex((x) => x.id === u.id);
          state.entries[idx] = u;
        });
        render();
        await persist(dbPutMany('planner_entries', updated));
      },
      'period-delete-form'() {
        deletePeriod(form().id);
      },

      'set-theme'(el) {
        updateSettings({ theme: el.dataset.value });
      },
      'set-week'(el) {
        updateSettings({ weekStartsOn: Number(el.dataset.value) === 0 ? 0 : 1 });
      },
      'toggle-setting'(el) {
        const k = el.dataset.key;
        updateSettings({ [k]: state.settings[k] === false });
      },
      async 'notifications-toggle'() {
        const on = state.settings.notificationsEnabled && notifEnv().permission === 'granted';
        if (on) {
          await updateSettings({ notificationsEnabled: false });
          return;
        }
        const ok = await ensurePermission();
        await updateSettings({ notificationsEnabled: ok });
        if (ok) {
          toast('Powiadomienia włączone');
          checkReminders();
        }
      },
      async 'notify-test'() {
        const ok = await showNotification('Rutyna', 'Tak będą wyglądać przypomnienia.', 'rutyna-test');
        if (!ok) toast('Nie udało się wysłać powiadomienia');
      },
      async 'calendar-export'() {
        const list = calendarHabits();
        if (!list.length) return;
        await deliverFile('rutyna-przypomnienia.ics', 'text/calendar', buildICS(list, state.today));
      },

      async 'export-json'() {
        const payload = {
          app: 'Rutyna',
          appVersion: APP_VERSION,
          schemaVersion: 3,
          exportedAt: new Date().toISOString(),
          habits: state.habits,
          completions: state.completions,
          plannerEntries: state.entries,
          periods: state.periods,
          settings: state.settings
        };
        const ok = await deliverFile(`rutyna-kopia-${state.today}.json`, 'application/json', JSON.stringify(payload, null, 2));
        if (ok) toast('Kopia gotowa');
      },
      'import-json'() {
        document.getElementById('backup-input').click();
      },
      async 'import-confirm'() {
        const p = state.sheet?.payload;
        if (!p) return;
        await persist(
          dbTx(STORES, (t) => {
            STORES.forEach((s) => t.objectStore(s).clear());
            p.habits.forEach((x) => t.objectStore('habits').put(x));
            p.completions.forEach((x) => t.objectStore('completions').put(x));
            p.plannerEntries.forEach((x) => t.objectStore('planner_entries').put(x));
            p.periods.forEach((x) => t.objectStore('calendar_periods').put(x));
            t.objectStore('settings').put(p.settings);
          })
        );
        closeSheet(true);
        await loadAll();
        toast('Przywrócono dane z kopii');
      },
      async 'csv-habits'() {
        await deliverFile(`rutyna-nawyki-${state.today}.csv`, 'text/csv;charset=utf-8', habitsCsv());
      },
      async 'csv-planner'() {
        await deliverFile(`rutyna-plan-${state.today}.csv`, 'text/csv;charset=utf-8', plannerCsv());
      },
      'clear-all'() {
        openSheet('confirmClear');
      },
      async 'clear-confirm'() {
        await persist(dbClearAll());
        state.habits = [];
        state.completions = [];
        state.entries = [];
        state.periods = [];
        state.settings = { ...DEFAULT_SETTINGS, reminderLog: {} };
        applyTheme();
        closeSheet(true);
        toast('Usunięto wszystkie dane');
      },

      async 'toast-undo'() {
        const t = state.toast;
        if (!t || !t.undo) return;
        const fn = t.undo;
        t.undo = null;
        dismissToast();
        await fn();
      }
    };

    document.addEventListener('click', async (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled || !appRoot.contains(el)) return;
      const fn = ACTIONS[el.dataset.action];
      if (!fn) return;
      e.preventDefault();
      try {
        await fn(el, e);
      } catch (err) {
        console.error(err);
        toast('Coś poszło nie tak. Spróbuj ponownie.');
      }
    });

    document.addEventListener('submit', (e) => {
      if (!e.target.matches('[data-form]')) return;
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      ACTIONS['sheet-save']();
    });

    function onField(e) {
      const el = e.target;
      const key = el.dataset && el.dataset.field;
      const f = form();
      if (!key || !f) return;
      f[key] = el.value;
      f.dirty = true;
      if (f.error && e.type === 'input') f.error = null;
      if (key === 'time' && 'reminderTouched' in f && !f.reminderTouched) f.reminderTime = el.value || '08:00';
      if (key === 'reminderTime') f.reminderTouched = true;
      if ('rerender' in el.dataset || e.type === 'change') render();
    }
    document.addEventListener('input', onField);
    document.addEventListener('change', (e) => {
      if (e.target.id === 'backup-input') return;
      onField(e);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (state.menu) {
        state.menu = null;
        render();
      } else if (state.sheet) {
        ACTIONS['sheet-cancel']();
      }
    });

    document.getElementById('backup-input').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const payload = validateBackup(JSON.parse(await file.text()));
        openSheet('importConfirm', { payload });
      } catch (err) {
        toast(err instanceof SyntaxError ? 'Nie da się odczytać tego pliku.' : err.message);
      }
    });

    /* ============================================================
       Start, odświeżanie daty, Service Worker
       ============================================================ */
    async function loadAll() {
      try {
        const [habits, completions, entries, periods, settingsList] = await Promise.all(STORES.map(dbGetAll));
        const today = toDateStr();
        const migratedHabits = [];
        state.habits = habits.map((h) => {
          const r = migrateHabit(h, today);
          if (r.changed) migratedHabits.push(r.habit);
          return r.habit;
        });
        const migratedEntries = [];
        state.entries = entries.map((e) => {
          const r = migrateEntry(e);
          if (r.changed) migratedEntries.push(r.entry);
          return r.entry;
        });
        state.completions = completions;
        state.periods = periods;
        const saved = settingsList.find((s) => s.id === 'user_settings');
        state.settings = { ...DEFAULT_SETTINGS, ...(saved || {}) };
        state.today = today;
        state.ready = true;
        applyTheme();
        render();
        dbPutMany('habits', migratedHabits).catch(() => {});
        dbPutMany('planner_entries', migratedEntries).catch(() => {});
        checkReminders();
      } catch (err) {
        state.error = err && err.message ? err.message : 'Nieznany błąd bazy danych.';
        render();
      }
    }

    function refreshToday() {
      const t = toDateStr();
      if (t === state.today) return;
      const prev = state.today;
      state.today = t;
      const p = parseDate(t);
      if (state.planner.date === prev) Object.assign(state.planner, { date: t, y: p.getFullYear(), m: p.getMonth() });
      if (state.history.date === prev) Object.assign(state.history, { date: t, y: p.getFullYear(), m: p.getMonth() });
      render();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      refreshToday();
      checkReminders();
      if (state.tab === 'settings') render();
    });
    window.addEventListener('focus', () => {
      refreshToday();
      checkReminders();
    });
    setInterval(() => {
      refreshToday();
      checkReminders();
    }, 20000);

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    loadAll();
  })();
  </script>
